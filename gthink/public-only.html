<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow">
<title>GThink · Public Only · GVAULT</title>
<style>
:root{font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#05070b;color:#f7f8fb;--line:rgba(255,255,255,.14);--muted:#9aa5b8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#1e2940 0,#080b11 42%,#030407 100%)}body{min-height:100dvh;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}main{width:min(100%,760px);min-height:calc(100dvh - 24px);margin:auto;display:grid;grid-template-rows:auto auto 1fr auto;gap:10px}
header,.panel,.composer{border:1px solid var(--line);background:rgba(8,11,17,.76);backdrop-filter:blur(12px);box-shadow:0 18px 60px rgba(0,0,0,.28)}header{border-radius:22px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.title{font-size:13px;letter-spacing:.12em;text-transform:uppercase}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{padding:5px 8px;border:1px solid var(--line);border-radius:999px;font:700 10px/1 ui-monospace,SFMono-Regular,Consolas,monospace}.badge.ok{background:rgba(122,255,185,.08)}.badge.lock{background:rgba(255,210,112,.08)}
.trace{border-radius:20px;padding:10px 12px;font:600 10px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;color:#c8d1df;min-height:64px;white-space:pre-wrap;overflow:auto;max-height:150px}.chat{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px}.msg{max-width:88%;border:1px solid var(--line);border-radius:22px;padding:13px 15px;white-space:pre-wrap;line-height:1.45;box-shadow:0 12px 34px rgba(0,0,0,.2)}.msg.user{align-self:flex-end;background:linear-gradient(145deg,#31528c,#5b3f9a)}.msg.agent{align-self:flex-start;background:linear-gradient(145deg,#173d45,#345363)}.meta{display:block;margin-top:7px;font:600 9px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;color:rgba(255,255,255,.58)}
.composer{border-radius:24px;padding:9px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}textarea{resize:none;min-height:48px;max-height:160px;border:0;outline:0;border-radius:18px;background:rgba(255,255,255,.06);color:inherit;padding:13px 14px;font:inherit;line-height:1.35}textarea::placeholder{color:#8f9aad}button{width:48px;height:48px;border:0;border-radius:50%;font-size:20px;font-weight:800;background:#f4f7fb;color:#0a0d12;cursor:pointer}button:disabled{opacity:.45;cursor:default}.foot{font:600 10px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);text-align:center;padding:0 8px 3px}.thinking::after{content:' ···';animation:pulse .9s infinite}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}@media(max-width:520px){.msg{max-width:94%}.title{font-size:12px}.badges{width:100%}}
</style>
</head>
<body>
<main>
<header>
  <div class="title">GThink · mini GVAULT public-only</div>
  <div class="badges">
    <span class="badge ok" id="engineBadge">PUBLIC ENGINE…</span>
    <span class="badge lock">NO PRIVATE ROUTE</span>
    <span class="badge" id="captureBadge">POST CAPTURE</span>
  </div>
</header>
<div class="panel trace" id="trace">boot · public-only
verrou · aucune route privée autorisée</div>
<section class="chat" id="chat" aria-live="polite"></section>
<div>
  <div class="composer">
    <textarea id="input" rows="1" maxlength="24576" placeholder="Parler à l’agent GThink public…" aria-label="Message pour GThink public"></textarea>
    <button id="send" type="button" aria-label="Envoyer">↑</button>
  </div>
  <div class="foot">public.user → GThink public routing → public native + public knowledge → réponse → FIRST_CAPTURE sortie → public blob stream</div>
</div>
</main>
<script src="../scripts/gvault-agent-live-blob.js?v=7" data-gvault-agent-live-blob="V7"></script>
<script src="../scripts/gthink-public-native-engine.js?v=2" data-gthink-public-native-engine="V2"></script>
<script type="module">
import { secondKernelKnowledge } from './second-kernel/blob/second-kernel-adapter.js';

const PAGE_SCHEMA='GTHINK_PUBLIC_ONLY_TEST_PAGE_V1';
const CAPTURE_SCHEMA='GTHINK_PUBLIC_POST_RESPONSE_CAPTURE_V1';
const STORE_KEY='gvault.gthink.public-only.captures.v1';
const HISTORY_KEY='gvault.gthink.public-only.history.v1';
const MAX_CAPTURE=40,MAX_HISTORY=12;
const api=window.GVAULT_AGENT_LIVE_BLOB;
const input=document.getElementById('input'),send=document.getElementById('send'),chat=document.getElementById('chat'),traceBox=document.getElementById('trace'),engineBadge=document.getElementById('engineBadge'),captureBadge=document.getElementById('captureBadge');
let busy=false,history=readJson(HISTORY_KEY,[]).slice(-MAX_HISTORY),engine=null;
const traces=['boot · public-only','verrou · aucune route privée autorisée'];

function uid(prefix='pub'){return `${prefix}-${crypto.randomUUID?.()||`${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`}`}
function clean(v){return String(v??'').trim()}
function readJson(key,fallback){try{const v=JSON.parse(localStorage.getItem(key)||'null');return v??fallback}catch{return fallback}}
function writeJson(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch{return false}}
function log(line){traces.push(line);if(traces.length>12)traces.splice(0,traces.length-12);traceBox.textContent=traces.join('\n');traceBox.scrollTop=traceBox.scrollHeight}
function setBusy(v){busy=v;send.disabled=v;input.disabled=v;engineBadge.classList.toggle('thinking',v)}
function autosize(){input.style.height='auto';input.style.height=Math.min(160,Math.max(48,input.scrollHeight))+'px'}
function addMessage(role,text,meta=''){const el=document.createElement('article');el.className='msg '+role;el.textContent=text;const m=document.createElement('span');m.className='meta';m.textContent=meta;el.appendChild(m);chat.appendChild(el);chat.scrollTop=chat.scrollHeight}
async function sha256(text){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(text)));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function speak(kind,payload,parentBlobId=null,meta={}){try{return api?.speak?.({schema:'GVAULT_UNIVERSAL_BLOB_V1',blobId:meta.blobId||uid('blob'),parentBlobId,conversationId:meta.conversationId||'gthink-public-only',kind,role:meta.role||'system',from:meta.from||'GThinkPublicOnly',to:'public.bus',intent:meta.intent||kind,language:'fr',at:new Date().toISOString(),surface:'Gvault-Pages:gthink/public-only.html',streamUrl:api?.streamUrl||'gvault://blobs/public/gthink/stream',text:meta.text,payload:{...payload,pageSchema:PAGE_SCHEMA,publicOnly:true,privateRouteAllowed:false},understoodBy:['GThink','public-kernel','public-ui','second-kernel','public-native','post-response-capture'],silent:true,muted:false})}catch{return null}}
async function ensureEngine(){if(engine?.answer)return engine;await window.GTHINK_PUBLIC_NATIVE_ENGINE?.ready?.().catch(()=>null);engine=window.GTHINK_PUBLIC_NATIVE_ENGINE;if(!engine?.answer)throw new Error('public_native_engine_unavailable');await secondKernelKnowledge.ready().catch(()=>null);const status=engine.status?.()||{};engineBadge.textContent=(status.knowledgeAware?'PUBLIC + KNOWLEDGE':'PUBLIC ENGINE');engineBadge.classList.add('ok');log(`engine · ${status.engine||'public-native'} · ${status.model||'native'}`);return engine}
async function buildContext(message,requestId){log('route · contexte public');const ctx=await secondKernelKnowledge.contextForTask({taskId:requestId,intent:'interpret_and_reply',requestedFunction:'public_only_agent_reply',message,text:message,constraints:['public-only','no-private-route','preserve-full-meaning','post-response-capture']}).catch(e=>({schema:'gthink.public.context.error',error:clean(e?.message||e)}));const branches=Object.keys(ctx?.knowledge?.branches||{});log(`worker.context · ${branches.length?branches.join(', '):'aucune branche'}`);return ctx}
async function routePublic(message){const requestId=uid('request'),conversationId='gthink-public-only';const requestBlob=speak('utterance',{text:message},null,{blobId:requestId,conversationId,role:'user',from:'public.user',intent:'interpret_and_reply',text:message});log('route · input → public GThink');
  speak('gthink.public-only.route.start',{requestBlobId:requestId,guards:['NO_PRIVATE_ROUTE','PUBLIC_DATA_ONLY','POST_RESPONSE_CAPTURE_ONLY']},requestId,{conversationId,role:'router',from:'GThinkPublicOnlyRouter'});
  const [e,ctx]=await Promise.all([ensureEngine(),buildContext(message,requestId)]);
  const request={schema:'GVAULT_UNIVERSAL_BLOB_V1',blobId=requestId,conversationId,kind:'gateway.request',role:'gateway',text:message,payload:{message,history:history.slice(-MAX_HISTORY),secondKernelContext:ctx,publicOnly:{schema:PAGE_SCHEMA,noPrivateRoute:true,postResponseCapture:true}}};
  log('worker.agent · public-native + public knowledge');
  let result=await e.answer(request);
  let text=clean(typeof result==='string'?result:result?.text||result?.display);
  if(!text)throw new Error('public_agent_empty_reply');
  const replyBlob=speak('gateway.response',{text,requestBlobId:requestId,engine:result?.engine||'public-native',model:result?.model||null,knowledgeAware:result?.knowledgeAware===true},requestBlob?.blobId||requestId,{conversationId,role:'gthink',from:'GThinkPublicOnly',intent:'reply',text});
  log(`route · réponse publique · ${result?.engine||'public-native'}`);
  return {requestId,requestBlob,replyBlob,result,text,context:ctx};
}
async function postResponseCapture(message,routed){const base={schema:CAPTURE_SCHEMA,captureId:uid('capture'),mode:'POST_RESPONSE_CAPTURE',publicOnly:true,privateTouched:false,capturedAt:new Date().toISOString(),conversationId:'gthink-public-only',input:{text:message,utf8Bytes:new TextEncoder().encode(message).byteLength},output:{text:routed.text,utf8Bytes:new TextEncoder().encode(routed.text).byteLength,engine:routed.result?.engine||'public-native',model:routed.result?.model||null},routing:{requestBlobId:routed.requestId,responseBlobId:routed.replyBlob?.blobId||null,knowledgeBranches:Object.keys(routed.context?.knowledge?.branches||{}),guards:['NO_PRIVATE_ROUTE','PUBLIC_DATA_ONLY'],trace:[...traces.slice(-8)]}};
  const contentSha256=await sha256(JSON.stringify(base));const record={...base,contentSha256};
  const captures=readJson(STORE_KEY,[]);captures.push(record);while(captures.length>MAX_CAPTURE)captures.shift();const persisted=writeJson(STORE_KEY,captures);
  speak('gthink.post_response.capture',{capture:record,persistedLocal:persisted,distribution:'public-blob-stream'},routed.replyBlob?.blobId||routed.requestId,{conversationId:'gthink-public-only',role:'capture',from:'FIRST_CAPTURE_PUBLIC_EXIT',intent:'capture_after_response'});
  captureBadge.textContent=persisted?'CAPTURE ✓':'CAPTURE STREAM';captureBadge.classList.add('ok');log(`FIRST_CAPTURE sortie · ${contentSha256.slice(0,12)} · blobs publics`);return record;
}
async function submit(){if(busy)return;const message=clean(input.value);if(!message)return;setBusy(true);addMessage('user',message,'public.user');input.value='';autosize();try{const routed=await routePublic(message);addMessage('agent',routed.text,`${routed.result?.engine||'public-native'} · public-only`);history.push({role:'user',content:message},{role:'assistant',content:routed.text});history=history.slice(-MAX_HISTORY);writeJson(HISTORY_KEY,history);await postResponseCapture(message,routed)}catch(e){const err=clean(e?.message||e);log('erreur · '+err);addMessage('agent','Le noyau public n’a pas pu produire de réponse : '+err,'aucune route privée tentée');speak('error',{error:err,privateRouteAttempted:false},null,{role:'gthink',from:'GThinkPublicOnly',intent:'report_public_only_error'})}finally{setBusy(false);input.focus()}}

input.addEventListener('input',autosize);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();void submit()}});send.addEventListener('click',()=>void submit());
addMessage('agent','Mini GVAULT public-only prêt. Cette page ne tente aucune route vers le privé.','public-only · FIRST_CAPTURE après réponse');
void ensureEngine().then(()=>log('ready · agent public disponible')).catch(e=>{engineBadge.textContent='ENGINE ERROR';log('boot error · '+clean(e?.message||e))});
window.GTHINK_PUBLIC_ONLY_TEST=Object.freeze({schema:PAGE_SCHEMA,routePublic,postResponseCapture,get history(){return [...history]},get captures(){return readJson(STORE_KEY,[])},guards:Object.freeze(['NO_PRIVATE_ROUTE','PUBLIC_DATA_ONLY','POST_RESPONSE_CAPTURE_ONLY'])});
</script>
</body>
</html>
