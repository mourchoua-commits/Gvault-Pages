<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>GVAULT · Projets reconstruits</title>
<style>
:root{--bg:#070907;--panel:#0d110e;--line:#303a32;--text:#e7e2d2;--muted:#989d91;--accent:#c8a95a;--ok:#82c89a;--warn:#d8b66b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{padding:12px}.top{position:sticky;top:0;z-index:3;background:#070907f2;border:1px solid var(--line);border-radius:12px;padding:12px;backdrop-filter:blur(8px)}h1{margin:0 0 5px;font-size:16px;color:var(--accent)}.sub{color:var(--muted);font-size:9px}.tools{display:grid;grid-template-columns:minmax(160px,1fr) auto;gap:8px;margin-top:10px}input,select{min-height:44px;border:1px solid var(--line);border-radius:9px;background:#090c0a;color:var(--text);padding:8px;font:inherit}.stats{margin:10px 2px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:8px}.card{border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:10px}.card h2{font-size:12px;margin:0 0 5px}.meta,.proof{display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:8px;border:1px solid var(--line);border-radius:999px;padding:3px 6px;color:var(--muted)}.tag.ok{border-color:var(--ok);color:var(--ok)}.tag.warn{border-color:var(--warn);color:var(--warn)}p{margin:8px 0;color:#c8c4b8}.open{display:inline-flex;min-height:40px;align-items:center;border:1px solid var(--accent);border-radius:8px;padding:6px 9px;color:var(--accent);text-decoration:none;font-weight:700}.locked{font-size:9px;color:var(--warn)}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:520px){.tools{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><h1>GVAULT · PROJETS RECONSTRUITS</h1><div class="sub">Archives + changelogs + ONOU + artefacts + branches · trace ≠ PASS · aucun verbatim privé publié.</div><div class="tools"><input id="q" placeholder="Rechercher projet, lab, outil…"><select id="kind"><option value="">TOUS</option><option>project</option><option>module</option><option>version</option><option>duplicate</option><option>methodology</option></select></div></header>
<div class="stats" id="stats">Chargement…</div><main class="grid" id="grid"></main>
<script>
(async()=>{'use strict';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const parts=await Promise.all([1,2,3,4].map(async n=>{const r=await fetch(`./catalog-part-${n}.v2.json`,{cache:'no-store'});if(!r.ok)throw new Error(`catalog part ${n} HTTP ${r.status}`);return r.json()}));const entries=parts.sort((a,b)=>a.part-b.part).flatMap(x=>x.entries||[]);const q=document.querySelector('#q'),kind=document.querySelector('#kind'),grid=document.querySelector('#grid'),stats=document.querySelector('#stats');function render(){const needle=q.value.trim().toLowerCase(),k=kind.value;const rows=entries.filter(x=>(!k||x.kind===k)&&(!needle||[x.name,x.version,x.category,x.status,x.summary,(x.proof||[]).join(' ')].join(' ').toLowerCase().includes(needle)));stats.textContent=`${rows.length} / ${entries.length} entrées · ${entries.filter(x=>x.status==='trace-only'||x.status==='branch-trace').length} traces seules · ${entries.filter(x=>x.publicPath).length} surfaces publiques référencées`;grid.innerHTML=rows.length?rows.map(x=>{const publicOpen=x.publicPath&&!/control-tower|gadmin/.test(x.id);return `<article class="card"><h2>${esc(x.name)}</h2><div class="meta"><span class="tag">${esc(x.kind)}</span><span class="tag">${esc(x.version||'version —')}</span><span class="tag ${x.confidence>=.98?'ok':'warn'}">preuve ${Math.round((x.confidence||0)*100)}%</span><span class="tag">${esc(x.status)}</span></div><p>${esc(x.summary)}</p><div class="proof">${(x.proof||[]).map(p=>`<span class="tag">${esc(p)}</span>`).join('')}</div>${publicOpen?`<p><a class="open" href="../../${esc(x.publicPath)}">OUVRIR SURFACE</a></p>`:x.publicPath?'<p class="locked">SAS PRINCIPAL REQUIS · ouvrir depuis GVAULT.</p>':''}</article>`}).join(''):'<div class="empty">Aucun résultat.</div>'}q.addEventListener('input',render);kind.addEventListener('change',render);render()})().catch(e=>{document.querySelector('#stats').textContent='CATALOGUE INDISPONIBLE · '+e.message})
</script>
</body></html>
