<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>GVAULT · CONTROL TOWER</title>
<style>
:root{--bg:#070907;--panel:#0c100d;--panel2:#111612;--line:#303a32;--text:#e7e2d2;--muted:#989d91;--accent:#c8a95a;--ok:#82c89a;--warn:#d8b66b;--bad:#e88989}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{min-height:100vh}.top{position:sticky;top:0;z-index:5;background:rgba(7,9,7,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px}.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.brand h1{font-size:14px;margin:0;letter-spacing:.08em}.status{font-size:10px;padding:4px 7px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}.status[data-kind=ok]{color:var(--ok);border-color:var(--ok)}.status[data-kind=bad]{color:var(--bad);border-color:var(--bad)}.status[data-kind=busy]{color:var(--warn);border-color:var(--warn)}.auth{margin-left:auto;display:flex;gap:6px}.auth input{width:min(45vw,260px)}button,input,textarea{font:inherit}button{cursor:pointer;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px 9px}button:hover,button.active{border-color:var(--accent);color:var(--accent)}input,textarea{background:#080b09;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:8px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:10px}.kpi{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:10px}.kpi b{font-size:20px;display:block}.kpi span{color:var(--muted);font-size:9px}.toolbar{display:flex;gap:6px;padding:0 10px 10px;overflow:auto}.toolbar input{min-width:210px;flex:1}.layout{display:grid;grid-template-columns:190px minmax(300px,430px) 1fr;gap:8px;padding:0 10px 10px;min-height:56vh}.pane{border:1px solid var(--line);background:var(--panel);border-radius:10px;overflow:hidden;min-height:0}.paneTitle{padding:9px;border-bottom:1px solid var(--line);font-size:10px;color:var(--accent);display:flex;justify-content:space-between}.engines{padding:6px;max-height:60vh;overflow:auto}.engines button{width:100%;display:flex;justify-content:space-between;margin-bottom:5px;font-size:9px}.events{max-height:60vh;overflow:auto;padding:6px}.event{display:grid;grid-template-columns:1fr 34px;gap:4px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--panel2)}.event.critical{box-shadow:inset 3px 0 var(--bad)}.event.warning{box-shadow:inset 3px 0 var(--warn)}.event.ok{box-shadow:inset 3px 0 var(--ok)}.event.selected{border-color:var(--accent)}.eventMain{border:0;background:transparent;text-align:left;padding:8px}.tagBtn{border:0;border-left:1px solid var(--line);border-radius:0;background:transparent;font-size:16px}.eventTop{display:flex;gap:6px;align-items:center;font-size:8px}.eventTop time{margin-left:auto;color:var(--muted)}.summary{font-size:10px;line-height:1.35;margin-top:4px}.meta{font-size:8px;color:var(--muted);margin-top:4px}.sev{width:12px;text-align:center}.detail{padding:10px;max-height:60vh;overflow:auto}.detailHead{display:flex;justify-content:space-between;align-items:center}.detailHead h2{margin:4px 0;font-size:14px}.badge{font-size:8px;border:1px solid var(--line);border-radius:999px;padding:3px 6px}.badge.critical{color:var(--bad)}.badge.warning{color:var(--warn)}.badge.ok{color:var(--ok)}.detail h3{font-size:12px;line-height:1.5}.detail dl{display:grid;grid-template-columns:90px 1fr;font-size:9px;gap:5px}.detail dt{color:var(--muted)}.detail dd{margin:0;word-break:break-all}.detail section{border-top:1px solid var(--line);padding-top:9px;margin-top:9px;font-size:9px}.detail pre{white-space:pre-wrap;word-break:break-word;color:var(--muted);font-size:8px;max-height:260px;overflow:auto}.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.chips span{border:1px solid var(--line);border-radius:999px;padding:3px 5px;color:var(--muted);font-size:7px}.proof{word-break:break-all;margin:4px 0;color:var(--muted)}.tracksWrap{padding:0 10px 10px}.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:7px}.track{border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:9px}.trackTop{display:flex;justify-content:space-between;font-size:8px;color:var(--muted)}.track h3{font-size:10px}.trackMeta{font-size:8px;color:var(--muted)}.trackActions{display:flex;gap:5px;margin-top:8px}.trackActions button{font-size:8px}.terminal{margin:0 10px 14px;border:1px solid var(--line);border-radius:10px;background:#050705;overflow:hidden}.terminalHead{padding:7px 9px;border-bottom:1px solid var(--line);font-size:9px;color:var(--accent)}.terminalLog{height:150px;overflow:auto;padding:8px;font-size:8px;line-height:1.45;color:var(--muted)}.terminalLog .ok{color:var(--ok)}.terminalLog .warn{color:var(--warn)}.terminalLog .bad{color:var(--bad)}.terminalLog .cmd{color:var(--text)}.terminal form{display:flex;border-top:1px solid var(--line)}.terminal form span{padding:8px;color:var(--accent)}.terminal form input{flex:1;border:0;border-radius:0}.empty{text-align:center;padding:20px;color:var(--muted);font-size:9px}.empty.big{padding:50px 10px}dialog{width:min(92vw,620px);border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:0}dialog::backdrop{background:rgba(0,0,0,.72)}.dialogBody{padding:14px}.dialogBody h2{font-size:13px}.dialogBody label{display:block;font-size:9px;color:var(--muted);margin:7px 0}.dialogBody>input,.dialogBody textarea{width:100%}.anchors label{border:1px solid var(--line);padding:6px;border-radius:7px}.dialogActions{display:flex;justify-content:flex-end;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}.timeline{max-height:55vh;overflow:auto}.timelineItem{padding:8px;border-left:2px solid var(--accent);margin:7px 0;background:var(--panel2)}.timelineItem time,.timelineItem small{display:block;color:var(--muted);font-size:8px}.timelineItem b{font-size:9px}.timelineItem p{font-size:9px}@media(max-width:900px){.layout{grid-template-columns:1fr 1fr}.layout>.pane:first-child{display:none}.detail{max-height:none}.events{max-height:52vh}}@media(max-width:620px){.brand{align-items:flex-start}.auth{width:100%;margin:0}.auth input{flex:1;width:auto}.kpis{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.events{max-height:42vh}.pane:nth-child(3){min-height:340px}.toolbar{flex-wrap:wrap}.toolbar input{order:-1;width:100%;flex-basis:100%}}
</style>
</head><body>
<header class="top"><div class="brand"><h1>GVAULT · CONTROL TOWER</h1><span class="status" id="connectionState">VERROUILLÉ</span><small>dernier refresh <b id="lastRefresh">—</b></small><div class="auth"><input id="token" type="password" autocomplete="off" placeholder="SAS token privé · mémoire uniquement"><button id="connect">OUVRIR</button><button id="lock">FERMER</button></div></div></header>
<section class="kpis"><div class="kpi"><b id="kEvents">0</b><span>ÉVÉNEMENTS</span></div><div class="kpi"><b id="kAlerts">0</b><span>ALERTES</span></div><div class="kpi"><b id="kEngines">0</b><span>MOTEURS</span></div><div class="kpi"><b id="kTracks">0</b><span>SUIVIS ACTIFS</span></div></section>
<nav class="toolbar"><button class="active" data-mode="LIVE">LIVE</button><button data-mode="ALERTES">ALERTES</button><button data-mode="SUIVIS">SUIVIS</button><button id="refresh">RAFRAÎCHIR</button><input id="search" placeholder="rechercher moteur, projet, ledger, SHA, statut…"></nav>
<main class="layout"><section class="pane"><div class="paneTitle">MOTEURS <span>sources</span></div><div class="engines" id="engineList"></div></section><section class="pane"><div class="paneTitle">FLUX <span id="eventCount">0</span></div><div class="events" id="eventList"></div></section><section class="pane"><div class="paneTitle">INSPECTION <span>preuve brute</span></div><div class="detail" id="detail"></div></section></main>
<section class="tracksWrap"><div class="paneTitle">INFORMATIONS TAGUÉES / SUIVIS PRÉCIS</div><div class="tracks" id="trackList"></div></section>
<section class="terminal"><div class="terminalHead">TERMINAL · commandes: help</div><div class="terminalLog" id="terminalLog"></div><form id="terminalForm"><span>&gt;</span><input id="terminalInput" autocomplete="off" spellcheck="false" placeholder="status / alerts / track TRACK-…"></form></section>
<dialog id="trackDialog"><div class="dialogBody"><h2>TAG / SUIVRE CETTE INFO</h2><div id="trackOrigin" class="trackMeta"></div><label>Nom du suivi</label><input id="trackLabel"><label>Note</label><textarea id="trackNote" rows="3"></textarea><label>Ancres qui permettront de rattacher les prochains événements</label><div class="anchors" id="trackAnchors"></div></div><div class="dialogActions"><button id="trackCancel">ANNULER</button><button id="trackConfirm">CRÉER LE SUIVI</button></div></dialog>
<dialog id="trackModal"><div class="dialogBody"><h2 id="trackTimelineTitle">TIMELINE</h2><div class="timeline" id="trackTimeline"></div></div><div class="dialogActions"><button id="trackTimelineClose">FERMER</button></div></dialog>
<script type="module" src="./app.mjs"></script>
</body></html>
