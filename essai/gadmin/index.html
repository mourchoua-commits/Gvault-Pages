<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>GVAULT · GADMIN</title>
<style>
:root{--bg:#070907;--panel:#0c100d;--panel2:#111612;--line:#303a32;--text:#e7e2d2;--muted:#989d91;--accent:#c8a95a;--ok:#82c89a;--warn:#d8b66b;--bad:#e88989}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}button,input{font:inherit}button{cursor:pointer;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px}button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}button:disabled{opacity:.42;cursor:not-allowed}input{background:#080b09;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px}.top{position:sticky;top:0;z-index:5;padding:10px;border-bottom:1px solid var(--line);background:rgba(7,9,7,.96);backdrop-filter:blur(9px)}.brand{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.brand h1{font-size:14px;margin:0}.pill{font-size:8px;border:1px solid var(--line);border-radius:999px;padding:4px 7px;color:var(--muted)}.pill.ok{border-color:var(--ok);color:var(--ok)}.auth{margin-left:auto;display:flex;gap:6px}.auth input{width:min(44vw,280px)}.notice{margin:9px 10px;padding:8px;border:1px solid var(--warn);border-radius:8px;color:var(--warn);font-size:9px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:10px}.kpi,.pane{border:1px solid var(--line);background:var(--panel);border-radius:10px}.kpi{padding:10px}.kpi b{display:block;font-size:18px}.kpi span{font-size:8px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(260px,.85fr) minmax(300px,1.15fr);gap:8px;padding:0 10px 10px}.pane{overflow:hidden}.paneTitle{padding:9px;border-bottom:1px solid var(--line);font-size:9px;color:var(--accent);display:flex;justify-content:space-between}.content{padding:9px;max-height:58vh;overflow:auto}.policy{display:grid;grid-template-columns:110px 1fr;gap:6px;font-size:9px}.policy dt{color:var(--muted)}.policy dd{margin:0;word-break:break-word}.item{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px;background:var(--panel2)}.itemTop{display:flex;justify-content:space-between;gap:8px;font-size:8px;color:var(--muted)}.item h3{font-size:10px;margin:5px 0}.item p{font-size:8px;color:var(--muted);margin:4px 0}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.actions button{font-size:8px}.alert{border-left:3px solid var(--line)}.alert.warning{border-left-color:var(--warn)}.alert.critical{border-left-color:var(--bad)}.terminal{margin:0 10px 14px;border:1px solid var(--line);border-radius:10px;background:#050705;overflow:hidden}.terminalHead{padding:7px 9px;border-bottom:1px solid var(--line);font-size:9px;color:var(--accent)}.log{height:130px;overflow:auto;padding:8px;font-size:8px;line-height:1.45;color:var(--muted)}.terminal form{display:flex;border-top:1px solid var(--line)}.terminal form span{padding:8px;color:var(--accent)}.terminal form input{flex:1;border:0;border-radius:0}.empty{padding:18px;text-align:center;color:var(--muted);font-size:9px}@media(max-width:680px){.auth{display:grid;grid-template-columns:minmax(0,1fr) auto auto;width:100%;margin:0;gap:6px}.auth input{min-width:0;width:100%}.auth button{min-width:44px;min-height:44px;white-space:normal;padding:7px 8px}.kpis{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.content{max-height:none}}
</style>
</head>
<body>
<header class="top"><div class="brand"><h1>GVAULT · GADMIN</h1><span class="pill ok">GVAULT SAS ✓</span><span class="pill" id="state">VERROUILLÉ</span><div class="auth"><input id="password" type="password" autocomplete="off" placeholder="SAS GADMIN · même mot de passe GVAULT"><button id="open">OUVRIR</button><button id="lock">FERMER</button></div></div></header>
<div class="notice" id="notice" hidden></div>
<section class="kpis"><div class="kpi"><b id="kQueue">0</b><span>EN ATTENTE</span></div><div class="kpi"><b id="kOfficial">0</b><span>PROJETS OFFICIELS</span></div><div class="kpi"><b id="kAlerts">0</b><span>ALERTES</span></div><div class="kpi"><b id="kOutbox">0</b><span>ACTIONS OUTBOX</span></div></section>
<main class="layout"><section class="pane"><div class="paneTitle">ADMIN · POLITIQUE / FILE <span id="policyMode">—</span></div><div class="content"><dl class="policy" id="policy"></dl><div id="queue"></div></div></section><section class="pane"><div class="paneTitle">VIGIE · ALERTES / ACTIVITÉ <span id="sourceAge">—</span></div><div class="content" id="alerts"></div></section></main>
<section class="terminal"><div class="terminalHead">GADMIN TERMINAL · help</div><div class="log" id="log"></div><form id="terminal"><span>&gt;</span><input id="cmd" autocomplete="off" spellcheck="false" placeholder="status / queue / alerts / outbox"></form></section>
<script>
(()=>{'use strict';const KEY='gvault.gadmin.entry.v1',MAX=8*60*60*1000;let p=null;try{p=JSON.parse(sessionStorage.getItem(KEY)||'null')}catch{}const ok=!!p&&p.schema==='GVAULT_GADMIN_ENTRY_V1'&&p.source==='GVAULT_SAS_READY'&&p.origin===location.origin&&Number.isFinite(Number(p.issuedAt))&&Date.now()-Number(p.issuedAt)>=0&&Date.now()-Number(p.issuedAt)<=MAX&&typeof p.nonce==='string'&&p.nonce.length>=16;if(!ok){document.body.innerHTML='<div style="padding:20px;color:#e88989;font:12px ui-monospace,monospace">GADMIN · ACCÈS VERROUILLÉ · passe d’abord par le SAS GVAULT</div>';setTimeout(()=>location.replace('../../?gadmin=locked'),700);return}const s=document.createElement('script');s.type='module';s.src='./app.mjs';document.body.appendChild(s)})();
</script>
</body></html>
