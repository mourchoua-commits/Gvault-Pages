<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>GVAULT · TRACE VFS ESSAI r6</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070907;color:#e7e1d2;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{padding:10px}.shell{display:grid;grid-template-rows:auto minmax(520px,1fr);gap:8px;min-height:100vh}.bar{padding:9px;border:1px solid #4c4b40;border-radius:12px;background:#0d100d;display:grid;gap:7px}.title{font-weight:950;color:#c8a95a}.meta,.state{font-size:9px;line-height:1.45;color:#aaa38f}.buttons{display:flex;gap:6px;flex-wrap:wrap}button{min-height:38px;padding:0 10px;border:1px solid #655d43;border-radius:9px;background:#11150f;color:#dfd7c2;font:850 9px ui-monospace,monospace}.ok{color:#a8dfb7}.warn{color:#e1c77d}.bad{color:#ffaaa0}iframe{width:100%;height:100%;min-height:680px;border:1px solid #4c4b40;border-radius:12px;background:#000}</style>
</head>
<body>
<div class="shell"><section class="bar"><div class="title">TRACE VFS · DATAPASSIV · ESSAI r6</div><div class="meta">Trace technique locale circulaire → scellement AES-GCM/RSA-OAEP avant suppression → outbox chiffrée. Aucun mot de passe, jeton ou valeur de formulaire n’est collecté. Sans guichet d’ingestion configuré, les capsules restent dans le VFS local.</div><div class="buttons"><button id="reload">RECHARGER BLOP</button><button id="seal">SCELLER MAINTENANT</button><button id="flush">TENTER PASSAGE</button><button id="status">ACTUALISER ÉTAT</button></div><div id="state" class="state">Initialisation du VFS…</div></section><iframe id="target" title="GVAULT BLOP r3"></iframe></div>
<script src="./trace-vfs.js"></script>
<script>
(()=>{'use strict';const f=document.querySelector('#target'),state=document.querySelector('#state');function load(){f.src='../../?essai-blop=1&essai-debug=1&r=6-'+Date.now()}async function show(){try{const s=await window.GVAULT_TRACE_VFS.stats();state.className='state '+(s.outbox.some(x=>x.lastError)?'warn':'ok');state.textContent='VFS · événements '+s.events+' · capsules '+s.outbox.length+' · '+s.outbox.map(x=>x.state+':'+x.eventCount).join(' | ')+' · transport '+(s.transport.endpoint?'GUICHET ACTIF':'LOCAL UNIQUEMENT')+' · epoch '+s.epoch+' · kid '+s.kid}catch(e){state.className='state bad';state.textContent='VFS ERROR · '+e.message}}
f.addEventListener('load',()=>{try{window.GVAULT_TRACE_VFS.hookWindow(f.contentWindow,f.contentDocument,'gvault-runtime')}catch{}setTimeout(show,500)});window.addEventListener('gvault:trace-capsule',show);window.addEventListener('gvault:trace-sent',show);window.addEventListener('gvault:trace-send-error',show);document.querySelector('#reload').onclick=load;document.querySelector('#seal').onclick=async()=>{await window.GVAULT_TRACE_VFS.sealPending();show()};document.querySelector('#flush').onclick=async()=>{await window.GVAULT_TRACE_VFS.flush();show()};document.querySelector('#status').onclick=show;setInterval(show,4000);load();show()})();
</script>
</body></html>
