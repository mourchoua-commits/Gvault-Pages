<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>GThink · blob vivant public · GVAULT</title>
<style>
:root{color-scheme:dark;background:#05070b;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;overflow:hidden;background:#05070b;color:#eef6ff}body{min-height:100dvh}
main{position:relative;width:100vw;height:100dvh;isolation:isolate;background:radial-gradient(circle at 50% 45%,#11192d 0,#070b13 44%,#020306 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.title{position:absolute;left:max(16px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));z-index:3;pointer-events:none;text-shadow:0 2px 18px #000}
.title b{display:block;font-size:clamp(18px,4vw,30px);letter-spacing:.12em;font-weight:750}.title span{display:block;margin-top:3px;font:600 10px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.12em;opacity:.68}
.legend{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3;display:flex;gap:9px;align-items:center;justify-content:center;padding:8px 11px;border:1px solid #ffffff15;border-radius:999px;background:#03060aa8;backdrop-filter:blur(10px);font:600 10px/1 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:nowrap;color:#dce7f5}
.legend i{width:7px;height:7px;border-radius:50%;display:inline-block;box-shadow:0 0 12px currentColor}.cyan{color:#5de9ff}.violet{color:#df6cff}.gold{color:#ffd47d}.white{color:#eef6ff}
.note{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(15px,env(safe-area-inset-top));z-index:3;max-width:190px;text-align:right;font:500 9px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.05em;color:#c9d4e3;opacity:.56;pointer-events:none}
@media(max-width:520px){.note{top:auto;bottom:52px;max-width:140px}.legend{font-size:8px;gap:6px;padding:7px 9px}.title span{font-size:9px}}
@media(prefers-reduced-motion:reduce){canvas{filter:none}}
</style>
</head>
<body>
<main aria-label="Représentation abstraite et animée de la topologie GThink publique">
  <canvas id="field"></canvas>
  <div class="title"><b>GTHINK</b><span>blob://public/gthink/visual · GVAULT</span></div>
  <div class="note">Représentation publique de topologie. Aucun contenu privé n’est chargé par cette page.</div>
  <div class="legend" aria-hidden="true"><i class="cyan"></i>PUBLIC <i class="violet"></i>PRIVÉ <i class="gold"></i>IMAGE <i class="white"></i>PLAYWRIGHT</div>
</main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('field');
const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU=Math.PI*2;
let W=0,H=0,DPR=1,t0=performance.now(),last=t0;
let pointer={x:.5,y:.5,active:false};
const seed=0x4754484b;
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let q=Math.imul(a^a>>>15,1|a);q=q+Math.imul(q^q>>>7,61|q)^q;return((q^q>>>14)>>>0)/4294967296}}
const rnd=mulberry32(seed);
const palette={public:[93,233,255],private:[223,108,255],image:[255,212,125],vault:[235,242,255]};
const cores=[
  {id:'public',label:'PUBLIC',x:.26,y:.55,r:.12,c:palette.public,phase:0.2},
  {id:'private',label:'PRIVÉ',x:.74,y:.55,r:.12,c:palette.private,phase:2.3},
  {id:'image',label:'IMAGE',x:.50,y:.29,r:.095,c:palette.image,phase:4.1},
  {id:'vault',label:'GVAULT',x:.50,y:.59,r:.055,c:palette.vault,phase:1.1}
];
const portals=Array.from({length:36},(_,i)=>({a:i/36*TAU+rnd()*.04,r:.39+rnd()*.07,s:.35+rnd()*.85,phase:rnd()*TAU,size:1.7+rnd()*3.4}));
const motes=Array.from({length:110},()=>({lane:Math.floor(rnd()*6),u:rnd(),speed:.045+rnd()*.095,size:.6+rnd()*1.8,phase:rnd()*TAU}));
const stars=Array.from({length:145},()=>({x:rnd(),y:rnd(),z:.2+rnd()*.8,p:rnd()*TAU}));
const lanes=[['public','vault'],['private','vault'],['image','vault'],['public','private'],['public','image'],['private','image']];
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize,{passive:true});resize();
canvas.addEventListener('pointermove',e=>{pointer.x=e.clientX/W;pointer.y=e.clientY/H;pointer.active=true},{passive:true});
canvas.addEventListener('pointerleave',()=>pointer.active=false,{passive:true});
canvas.addEventListener('pointerdown',e=>{pointer.x=e.clientX/W;pointer.y=e.clientY/H;pointer.active=true},{passive:true});
function pos(core,time){const m=Math.min(W,H);const drift=reduced?0:Math.sin(time*.00022+core.phase)*m*.008;return{x:core.x*W+Math.cos(core.phase+time*.00011)*drift,y:core.y*H+Math.sin(core.phase*1.7+time*.00013)*drift,r:core.r*m}}
function glowCircle(x,y,r,c,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${c[0]},${c[1]},${c[2]},${a})`);g.addColorStop(.4,`rgba(${c[0]},${c[1]},${c[2]},${a*.35})`);g.addColorStop(1,`rgba(${c[0]},${c[1]},${c[2]},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()}
function blobPath(x,y,r,time,phase,amp=.12){const n=46;ctx.beginPath();for(let i=0;i<=n;i++){const a=i/n*TAU;const wob=1+Math.sin(a*3+time*.0011+phase)*amp*.55+Math.sin(a*5-time*.00075+phase*2)*amp*.32+Math.sin(a*2+time*.00043)*amp*.18;const rr=r*wob;const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.closePath()}
function drawCore(core,p,time){const [r,g,b]=core.c;glowCircle(p.x,p.y,p.r*2.3,core.c,.17);const grad=ctx.createRadialGradient(p.x-p.r*.28,p.y-p.r*.35,p.r*.05,p.x,p.y,p.r*1.25);grad.addColorStop(0,`rgba(255,255,255,.92)`);grad.addColorStop(.18,`rgba(${r},${g},${b},.90)`);grad.addColorStop(.58,`rgba(${Math.round(r*.55)},${Math.round(g*.55)},${Math.round(b*.55)},.62)`);grad.addColorStop(1,`rgba(${Math.round(r*.12)},${Math.round(g*.12)},${Math.round(b*.12)},.07)`);ctx.fillStyle=grad;blobPath(p.x,p.y,p.r,time,core.phase,core.id==='vault'?.08:.14);ctx.fill();ctx.strokeStyle=`rgba(${r},${g},${b},.58)`;ctx.lineWidth=1.1;ctx.stroke();
  for(let k=0;k<3;k++){ctx.strokeStyle=`rgba(${r},${g},${b},${.11-k*.02})`;ctx.lineWidth=1;blobPath(p.x,p.y,p.r*(1.18+k*.16),time*(1-k*.08),core.phase+k,.08);ctx.stroke()}
  const fs=Math.max(9,Math.min(18,p.r*.2));ctx.font=`700 ${fs}px ui-monospace,SFMono-Regular,Consolas,monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=`rgba(244,249,255,${core.id==='vault'?.78:.9})`;ctx.fillText(core.label,p.x,p.y);
}
function curved(a,b,bend,time,color,alpha,width=1){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;const nx=-dy/len,ny=dx/len;const pulse=reduced?1:Math.sin(time*.0005+bend)*.15+1;const cx=mx+nx*bend*len*.18*pulse,cy=my+ny*bend*len*.18*pulse;ctx.strokeStyle=`rgba(${color[0]},${color[1]},${color[2]},${alpha})`;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(cx,cy,b.x,b.y);ctx.stroke();return{cx,cy}}
function qPoint(a,c,b,u){const v=1-u;return{x:v*v*a.x+2*v*u*c.x+u*u*b.x,y:v*v*a.y+2*v*u*c.y+u*u*b.y}}
function frame(now){const dt=Math.min(40,now-last);last=now;const time=reduced?t0:now;ctx.fillStyle='#03050a';ctx.fillRect(0,0,W,H);
  const bg=ctx.createRadialGradient(W*.5,H*.48,0,W*.5,H*.48,Math.max(W,H)*.7);bg.addColorStop(0,'#10192a');bg.addColorStop(.43,'#080c15');bg.addColorStop(1,'#020307');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(const s of stars){const tw=.18+.55*(.5+.5*Math.sin(time*.0007+s.p));ctx.fillStyle=`rgba(190,220,255,${tw*s.z*.55})`;ctx.fillRect(s.x*W,s.y*H,Math.max(.6,s.z*1.3),Math.max(.6,s.z*1.3))}
  const P={};for(const c of cores)P[c.id]=pos(c,time);
  const center={x:W*.5,y:H*.53};const ring=Math.min(W,H)*.43;
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<portals.length;i++){const p=portals[i];const a=p.a+(reduced?0:time*.000012*p.s);const rr=ring*p.r/.43;const x=center.x+Math.cos(a)*rr*(W>H?1.2:1),y=center.y+Math.sin(a)*rr*.82;const c=i%3===0?palette.image:(i%2?palette.private:palette.public);const pull=pointer.active?Math.max(0,1-Math.hypot(pointer.x*W-x,pointer.y*H-y)/180):0;glowCircle(x,y,p.size*(4+pull*4),c,.17+.16*pull);ctx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${.55+.3*pull})`;ctx.beginPath();ctx.arc(x,y,p.size+pull*1.5,0,TAU);ctx.fill();if(i%3===0){const target=i%2?P.image:P.vault;curved({x,y},target,(i%5-2)*.16,time,c,.08,.7)}}
  const laneGeom=[];
  lanes.forEach((pair,i)=>{const a=P[pair[0]],b=P[pair[1]];const color=i<3?(i===0?palette.public:i===1?palette.private:palette.image):palette.vault;const bend=(i-2.5)*.16;const q=curved(a,b,bend,time,color,i<3?.24:.10,i<3?1.15:.75);laneGeom.push({a,b,c:q,color})});
  for(const m of motes){if(!reduced)m.u=(m.u+m.speed*dt*.001)%1;const L=laneGeom[m.lane];const p=qPoint(L.a,L.c,L.b,m.u);const pulse=.35+.65*(.5+.5*Math.sin(time*.003+m.phase));glowCircle(p.x,p.y,m.size*5,L.color,.12*pulse);ctx.fillStyle=`rgba(${L.color[0]},${L.color[1]},${L.color[2]},${.45+.4*pulse})`;ctx.beginPath();ctx.arc(p.x,p.y,m.size,0,TAU);ctx.fill()}
  drawCore(cores[3],P.vault,time);drawCore(cores[0],P.public,time);drawCore(cores[1],P.private,time);drawCore(cores[2],P.image,time);
  ctx.restore();
  if(!reduced)requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
window.GVAULT_BLOB_STATE=Object.freeze({schema:'GVAULT_PUBLIC_GTHINK_BLOB_V1',route:'blob://public/gthink/visual',representation:'topology-only',privateContentLoaded:false,cores:['public','private','image','gvault'],mesh:'playwright-blob-portals'});
})();
</script>
</body>
</html>
