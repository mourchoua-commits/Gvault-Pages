<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>GVAULT · ESSAI · Stable + Control Tower gate</title>
<style>html,body{margin:0;min-height:100%;background:#060806;color:#d9d3c2;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{display:grid;place-items:center;padding:20px}.boot{max-width:560px;border:1px solid #555546;border-radius:14px;padding:18px;background:#0c0f0c}.boot b{color:#c8a95a}.state{margin-top:10px;font-size:12px;line-height:1.5;color:#a9a28f}.err{color:#ff8f8f}</style>
</head>
<body>
<div class="boot"><b>GVAULT · ESSAI</b><div class="state" id="state">Chargement du runtime Stable épinglé…</div></div>
<script>
(async()=>{
'use strict';
const BASE_COMMIT='fb5ab4a1d9e7f8d1dc382ce3ac89248c4c44a07d';
const BASE_URL='https://raw.githubusercontent.com/mourchoua-commits/Gvault-Pages/'+BASE_COMMIT+'/index.html';
const r=await fetch(BASE_URL,{cache:'no-store',credentials:'omit'});
if(!r.ok)throw new Error('Baseline gateway HTTP '+r.status);
let h=await r.text();
if(!/^\s*<!doctype html>/i.test(h)||!/<\/html>\s*$/i.test(h))throw new Error('Baseline gateway incomplet');
const needle='const nativeFetch=window.fetch.bind(window);';
const graft="const nativeFetch=window.fetch.bind(window);\nconst GVAULT_CONTROL_TOWER_ENTRY_KEY='gvault.controlTower.entry.v1';\ntry{sessionStorage.removeItem(GVAULT_CONTROL_TOWER_ENTRY_KEY)}catch{}\nfunction installControlTowerEntry(){\n if(document.getElementById('vaultControlTowerFab'))return;\n const style=document.createElement('style');style.setAttribute('data-gvault-control-tower-entry','V1');style.textContent='#vaultControlTowerFab{position:fixed;right:max(94px,calc(env(safe-area-inset-right) + 94px));bottom:max(10px,env(safe-area-inset-bottom));z-index:93;width:34px;height:34px;min-width:34px;min-height:34px;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 48%,var(--line));background:color-mix(in srgb,var(--panel1) 78%,transparent);color:var(--accent);place-items:center;padding:0;font:900 15px/1 ui-monospace,SFMono-Regular,Menlo,monospace;box-shadow:0 6px 24px rgba(0,0,0,.34),0 0 18px color-mix(in srgb,var(--accent) 8%,transparent);backdrop-filter:blur(5px);opacity:.7;transition:opacity .15s ease,transform .15s ease;display:none}#vaultControlTowerFab.ready{display:grid}#vaultControlTowerFab:hover,#vaultControlTowerFab:focus{opacity:1;transform:scale(1.03)}#vaultControlTowerFab:disabled{display:none}@media(max-width:620px){#vaultControlTowerFab{right:max(112px,calc(env(safe-area-inset-right) + 112px));bottom:max(8px,env(safe-area-inset-bottom));width:44px;height:44px;min-width:44px;min-height:44px}}';document.head.appendChild(style);\n const btn=document.createElement('button');btn.id='vaultControlTowerFab';btn.type='button';btn.textContent='⌾';btn.title='Control Tower';btn.setAttribute('aria-label','Ouvrir Control Tower');btn.disabled=true;document.body.appendChild(btn);\n const sync=()=>{const runtime=document.querySelector('#gvaultRuntime');const ready=!!runtime?.classList.contains('ready');btn.disabled=!ready;btn.classList.toggle('ready',ready)};\n btn.addEventListener('click',()=>{sync();if(btn.disabled)return;const b=crypto.getRandomValues(new Uint8Array(16));const nonce=Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');try{sessionStorage.setItem(GVAULT_CONTROL_TOWER_ENTRY_KEY,JSON.stringify({schema:'GVAULT_CONTROL_TOWER_ENTRY_V1',source:'GVAULT_SAS_READY',issuedAt:Date.now(),nonce,origin:location.origin}))}catch{return}location.assign('./essai/control-tower/v2.html')});\n sync();const timer=setInterval(sync,500);window.addEventListener('pagehide',()=>clearInterval(timer),{once:true});\n}\nif(document.readyState==='loading')window.addEventListener('DOMContentLoaded',installControlTowerEntry,{once:true});else installControlTowerEntry();";
if(!h.includes(needle))throw new Error('Point de greffe Control Tower introuvable');
h=h.replace(needle,graft);
document.open();document.write(h);document.close();
})().catch(e=>{const s=document.getElementById('state');if(s){s.classList.add('err');s.textContent='GVAULT INDISPONIBLE · '+String(e&&e.message||e)}console.error(e)});
</script>
</body>
</html>
