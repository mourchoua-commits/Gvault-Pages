<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>GVAULT · ESSAI · Stable + greffons</title>
<style>html,body{margin:0;min-height:100%;background:#060806;color:#d9d3c2;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{display:grid;place-items:center;padding:20px}.boot{max-width:560px;border:1px solid #555546;border-radius:14px;padding:18px;background:#0c0f0c}.boot b{color:#c8a95a}.state{margin-top:10px;font-size:12px;line-height:1.5;color:#a9a28f}.err{color:#ff8f8f}</style>
</head>
<body>
<div class="boot"><b>GVAULT · ESSAI</b><div class="state" id="state">Chargement du runtime Stable épinglé…</div></div>
<script>
(async()=>{
'use strict';
const STABLE_COMMIT='bb36cd4d328ca8c4ee94aae6fd1a2e5c63bac4e1';
const BLOP_SOURCE_COMMIT='05a1a25eeae7375e955fb71e0b0e7d9390337f32';
const STABLE_RAW='https://raw.githubusercontent.com/mourchoua-commits/GvaultStable/'+STABLE_COMMIT+'/';
const PAGES_RAW='https://raw.githubusercontent.com/mourchoua-commits/Gvault-Pages/'+BLOP_SOURCE_COMMIT+'/';
const STABLE_INDEX=STABLE_RAW+'index.html';
const BLOP_SOURCE_INDEX=PAGES_RAW+'index.html';
const CATALOG_MANIFEST=STABLE_RAW+'private-catalog/manifest.json';
const CATALOG_PAYLOAD=STABLE_RAW+'private-catalog/catalog.23243b824fe7935796256982ebb1982f22477edcd0e6d339a74bc69c705eecdc.bin';
const r=await fetch(STABLE_INDEX,{cache:'no-store',credentials:'omit'});
if(!r.ok)throw new Error('Stable index HTTP '+r.status);
const html=await r.text();
if(!/^\s*<!doctype html>/i.test(html)||!/<\/html>\s*$/i.test(html))throw new Error('Stable index incomplet');
const bridge=`<script data-gvault-pages-essai-bridge="GVAULT_PAGES_STABLE_MIRROR_V3">(()=>{'use strict';
const nativeFetch=window.fetch.bind(window);
const stableCommit='${STABLE_COMMIT}',blopSourceCommit='${BLOP_SOURCE_COMMIT}',manifestUrl='${CATALOG_MANIFEST}',payloadUrl='${CATALOG_PAYLOAD}',blopSourceUrl='${BLOP_SOURCE_INDEX}';
window.GVAULT_ESSAI_BASELINE=Object.freeze({schema:'GVAULT_PAGES_ESSAI_BASELINE_V3',sourceRepository:'mourchoua-commits/GvaultStable',sourceCommit:stableCommit,executionOrigin:location.origin,stableMutable:false,blopSourceCommit});
window.fetch=(input,init)=>{let u;try{u=new URL(typeof input==='string'?input:input.url,location.href)}catch{return nativeFetch(input,init)};if(u.origin===location.origin&&u.pathname.endsWith('/private-catalog/manifest.json'))return nativeFetch(manifestUrl,{...(init||{}),credentials:'omit'});if(u.origin===location.origin&&u.pathname.endsWith('/private-catalog/catalog.23243b824fe7935796256982ebb1982f22477edcd0e6d339a74bc69c705eecdc.bin'))return nativeFetch(payloadUrl,{...(init||{}),credentials:'omit'});return nativeFetch(input,init)};
function installEssaiBlopSafety(){
 const rail=document.querySelector('#gvBlopRail'),toggle=document.querySelector('#gvBlopRailToggle');if(!rail||!toggle)throw new Error('rail BLOP absent pour safety r3');
 let phase=rail.querySelector('.gv24Phase');if(!phase){phase=document.createElement('div');phase.className='gv24Phase';const theme=rail.querySelector('.gvbrTheme');(theme||rail.firstElementChild)?.insertAdjacentElement('afterend',phase)}
 const runtime=document.querySelector('#gvaultRuntime');
 const sync=()=>{const ok=!!runtime?.classList.contains('ready');toggle.classList.add('ready');rail.classList.toggle('gv24PreSas',!ok);const txt=ok?'BLOP · SESSION OUVERTE':'SAS · OUTILS VERROUILLÉS';if(phase.textContent!==txt)phase.textContent=txt;for(const b of rail.querySelectorAll('[data-gvbs-tool]'))b.disabled=!ok};
 if(runtime)new MutationObserver(sync).observe(runtime,{attributes:true,attributeFilter:['class']});
 const timer=setInterval(sync,1000);window.addEventListener('pagehide',()=>clearInterval(timer),{once:true});
 try{Object.defineProperty(window,'__GVAULT_PROJECT_STORE_PASSWORD__',{get(){return undefined},set(){throw new Error('Global SAS password exposure is forbidden on public gateway.');},configurable:false,enumerable:false})}catch{}
 window.GVAULT_PUBLIC_SAFETY_INFO=Object.freeze({schema:'GVAULT_PUBLIC_GATEWAY_SAFETY_ESSAI_R3',targetedObserver:true,subtreeObserver:false,idempotentPhaseText:true,preSasSensitiveToolsLocked:true,passwordGlobal:'forbidden'});sync();
}
async function graftBlop(){
 if(window.GVAULT_ESSAI_BLOP_GRAFT?.status==='PASS')return window.GVAULT_ESSAI_BLOP_GRAFT;
 const started=new Date().toISOString(),resp=await nativeFetch(blopSourceUrl,{cache:'no-store',credentials:'omit'});if(!resp.ok)throw new Error('BLOP source HTTP '+resp.status);const source=await resp.text();
 const src=new DOMParser().parseFromString(source,'text/html');
 const ids=new Set(['gvBlopFab','gvBlopPanel','gvBlopRail']);
 const selected=[...src.body.children].filter(el=>ids.has(el.id)||el.getAttributeNames().some(n=>n.startsWith('data-gvault-blop')||n.startsWith('data-gvault-public-safety')||n.startsWith('data-gvault-sas-first-action')));
 if(!selected.some(x=>x.id==='gvBlopPanel')||!selected.some(x=>x.matches?.('script[data-gvault-blop-runtime]')))throw new Error('blocs BLOP incomplets dans la source épinglée');
 let styles=0,scripts=0,markup=0,skippedUnsafe=0;
 for(const node of selected){if(node.matches?.('script[data-gvault-public-safety-runtime]')){skippedUnsafe++;continue}if(node.tagName==='SCRIPT'){const s=document.createElement('script');for(const a of node.attributes)s.setAttribute(a.name,a.value);s.textContent=node.textContent||'';document.body.appendChild(s);scripts++}else{document.body.appendChild(node.cloneNode(true));node.tagName==='STYLE'?styles++:markup++}}
 installEssaiBlopSafety();
 const required={terminal:!!window.GVAULT_BLOP_TERMINAL_INFO,panel:!!document.querySelector('#gvBlopPanel'),rail:!!document.querySelector('#gvBlopRail'),toggle:!!document.querySelector('#gvBlopRailToggle'),safety:window.GVAULT_PUBLIC_SAFETY_INFO?.schema==='GVAULT_PUBLIC_GATEWAY_SAFETY_ESSAI_R3'};
 const ok=Object.values(required).every(Boolean);const report=Object.freeze({schema:'GVAULT_PAGES_ESSAI_BLOP_GRAFT_V2',at:started,sourceCommit:blopSourceCommit,status:ok?'PASS':'FAIL',styles,scripts,markup,skippedUnsafe,required});window.GVAULT_ESSAI_BLOP_GRAFT=report;console.info('[GVAULT ESSAI BLOP]',report);if(!ok)throw new Error('greffe BLOP incomplète');return report
}
async function smoke(){const checks=[];const check=(name,ok,detail='')=>checks.push({name,ok:Boolean(ok),detail:String(detail||'')});check('baseline',window.GVAULT_ESSAI_BASELINE?.sourceCommit===stableCommit,stableCommit.slice(0,12));check('sas_dom',!!document.querySelector('#vaultPassword')&&!!document.querySelector('#unlockBtn'),'vaultPassword + unlockBtn');check('versions_dom',!!document.querySelector('#vaultUpdateFab'),'vaultUpdateFab');try{const m=await nativeFetch('./manifest.json?essai_smoke='+Date.now(),{cache:'no-store'}).then(x=>{if(!x.ok)throw new Error('HTTP '+x.status);return x.json()});check('manifest',m.schema==='GVAULT_PUBLIC_ENCRYPTED_V1',m.releaseId||m.schema)}catch(e){check('manifest',false,e.message)}try{const c=await nativeFetch('./CHOUFF.json?essai_smoke='+Date.now(),{cache:'no-store'}).then(x=>{if(!x.ok)throw new Error('HTTP '+x.status);return x.json()});check('chouff',c.schema==='GVAULT_PUBLIC_CHOUFF_MARKER_V1'&&c.telemetry===false,c.keyword||c.schema)}catch(e){check('chouff',false,e.message)}try{const cm=await window.fetch('./private-catalog/manifest.json',{cache:'no-store'}).then(x=>{if(!x.ok)throw new Error('HTTP '+x.status);return x.json()});check('catalog_manifest',cm.schema==='GVAULT_ENCRYPTED_PRIVATE_CATALOG_V1',cm.payload?.size||cm.schema);const b=await window.fetch('./private-catalog/'+String(cm.payload?.path||''),{cache:'no-store'}).then(x=>{if(!x.ok)throw new Error('HTTP '+x.status);return x.arrayBuffer()});check('catalog_payload',b.byteLength===Number(cm.payload?.size),b.byteLength+' octets')}catch(e){check('catalog_transport',false,e.message)}if(new URLSearchParams(location.search).get('essai-blop')==='1'){try{const g=await graftBlop();check('blop_graft',g.status==='PASS',g.sourceCommit.slice(0,12));check('blop_memory_contract',window.GVAULT_BLOP_TERMINAL_INFO?.authPersistence==='memory-only',window.GVAULT_BLOP_TERMINAL_INFO?.schema||'absent');check('blop_safety_r3',window.GVAULT_PUBLIC_SAFETY_INFO?.targetedObserver===true,window.GVAULT_PUBLIC_SAFETY_INFO?.schema||'absent')}catch(e){check('blop_graft',false,e.message)}}const failed=checks.filter(x=>!x.ok);const report=Object.freeze({schema:'GVAULT_PAGES_ESSAI_SMOKE_V3',at:new Date().toISOString(),sourceCommit:stableCommit,status:failed.length?'FAIL':'PASS',checks});window.GVAULT_ESSAI_SMOKE=report;console.info('[GVAULT ESSAI SMOKE]',report);if(new URLSearchParams(location.search).get('essai-debug')==='1'){const p=document.createElement('aside');p.id='gvaultEssaiSmoke';p.style.cssText='position:fixed;left:8px;bottom:8px;z-index:2147483647;max-width:min(92vw,390px);max-height:52vh;overflow:auto;padding:9px;border:1px solid '+(failed.length?'#d66':'#6d8')+';border-radius:9px;background:rgba(5,8,6,.94);color:#eee;font:700 9px/1.4 ui-monospace,monospace;box-shadow:0 8px 30px rgba(0,0,0,.45)';const esc=v=>String(v).replace(/[&<>]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]));p.innerHTML='<b>ESSAI SMOKE · '+report.status+'</b><br>'+checks.map(x=>(x.ok?'✓':'✕')+' '+esc(x.name)+(x.detail?' · '+esc(x.detail):'')).join('<br>');document.body.appendChild(p)}}
window.addEventListener('load',()=>setTimeout(()=>void smoke(),180),{once:true});
})();<\/script>`;
const head=html.search(/<head(?:\s[^>]*)?>/i);if(head<0)throw new Error('Stable <head> introuvable');const end=html.indexOf('>',head)+1;const mirrored=html.slice(0,end)+bridge+html.slice(end);document.open();document.write(mirrored);document.close();
})().catch(e=>{const s=document.getElementById('state');if(s){s.classList.add('err');s.textContent='BASELINE STABLE INDISPONIBLE · '+String(e&&e.message||e)}console.error(e)});
</script>
</body>
</html>
