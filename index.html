<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>GVAULT · ESSAI · strict live SAS handoff</title>
<style>html,body{margin:0;min-height:100%;background:#060806;color:#d9d3c2;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{display:grid;place-items:center;padding:20px}.boot{max-width:560px;border:1px solid #555546;border-radius:14px;padding:18px;background:#0c0f0c}.boot b{color:#c8a95a}.state{margin-top:10px;font-size:12px;line-height:1.5;color:#a9a28f}.err{color:#ff8f8f}</style>
</head>
<body>
<div class="boot"><b>GVAULT · ESSAI</b><div class="state" id="state">Chargement du runtime Stable épinglé…</div></div>
<script src="./scripts/gvault-pre-sas-vfs.js?v=1"></script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw-gvault-v1.js?v=4',{scope:'./',updateViaCache:'none'}).catch(e=>console.warn('GVAULT shell worker non installé',e));
}
</script>
<script>
(async()=>{
'use strict';
const BASE_COMMIT='fb5ab4a1d9e7f8d1dc382ce3ac89248c4c44a07d';
const BASE_URL='https://raw.githubusercontent.com/mourchoua-commits/Gvault-Pages/'+BASE_COMMIT+'/index.html';
const r=await fetch(BASE_URL,{cache:'no-store',credentials:'omit'});
if(!r.ok)throw new Error('Baseline gateway HTTP '+r.status);
let h=await r.text();
if(!/^\s*<!doctype html>/i.test(h)||!/<\/html>\s*$/i.test(h))throw new Error('Baseline gateway incomplet');
let reconstructedCatalog=[];
try{
 const parts=await Promise.all([1,2,3,4].map(async n=>{const x=await fetch(`./essai/project-catalog/catalog-part-${n}.v2.json`,{cache:'no-store',credentials:'omit'});if(!x.ok)throw new Error(`catalog ${n} HTTP ${x.status}`);return x.json()}));
 reconstructedCatalog=parts.sort((a,b)=>a.part-b.part).flatMap(x=>Array.isArray(x.entries)?x.entries:[]);
}catch(e){console.warn('GVAULT project reconstruction catalog unavailable',e)}
const projectMarker='const changelogBlueprints={';
if(reconstructedCatalog.length&&h.includes(projectMarker)){
 const accents=['#c8a95a','#67e8f9','#a98bff','#82c89a','#fb7185','#f59e0b'];
 const publicLaunchable=x=>!!x.publicPath&&!/^(control-tower|gadmin)$/.test(x.id);
 const recovered=reconstructedCatalog.map((x,i)=>({
   id:x.id,
   name:x.name,
   subtitle:`RECONSTRUCTION · ${x.kind||'trace'} · ${(x.proof||[]).join(' + ')||'preuve indexée'}`,
   version:x.version||'TRACE RECONSTRUITE',
   date:'29 août 2026',
   lastModified:'2026-08-29T00:52:00+02:00',
   modifiedSource:'reconstruction probante · archives + changelogs + ONOU + artefacts + Git',
   status:publicLaunchable(x)?'active':'candidate',
   confidence:(x.confidence||0)>=.98?'confirmed':'reconstructed',
   canonicalUser:true,
   playable:publicLaunchable(x),
   conversationProject:true,
   category:x.category||String(x.kind||'TRACE').toUpperCase(),
   accent:accents[i%accents.length],
   file:publicLaunchable(x)?x.publicPath:'',
   summary:x.summary||'Trace de projet reconstruite.',
   focus:'Conserver la filiation et approfondir les preuves dans le catalogue reconstruit ; aucune absence de build ne doit effacer la trace.',
   branches:['PROJECT CATALOG V2',...(x.proof||[]).slice(0,4)],
   report:`Projection publique sanitisée · état source ${x.status||'reconstructed'} · confiance ${Math.round((x.confidence||0)*100)}% · aucun verbatim privé publié.`
 }));
 const injection=`try{const __gvaultRecoveredProjects=${JSON.stringify(recovered)};for(const rp of __gvaultRecoveredProjects){if(!projects.some(p=>p.id===rp.id))projects.push(rp)}}catch(e){console.warn('project reconstruction graft skipped',e)}\n${projectMarker}`;
 h=h.replace(projectMarker,injection);
}
const needle='const nativeFetch=window.fetch.bind(window);';
const graft=`const nativeFetch=window.fetch.bind(window);
try{sessionStorage.removeItem('gvault.controlTower.entry.v1');sessionStorage.removeItem('gvault.gadmin.entry.v1')}catch{}
function installPrivateToolEntries(){
 if(document.getElementById('vaultControlTowerFab')||document.getElementById('vaultGAdminFab'))return;
 const style=document.createElement('style');style.setAttribute('data-gvault-private-tool-entries','V4-LIVE-SAS');style.textContent='#vaultControlTowerFab,#vaultGAdminFab{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));z-index:93;width:34px;height:34px;min-width:34px;min-height:34px;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 48%,var(--line));background:color-mix(in srgb,var(--panel1) 78%,transparent);color:var(--accent);place-items:center;padding:0;font:900 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;box-shadow:0 6px 24px rgba(0,0,0,.34),0 0 18px color-mix(in srgb,var(--accent) 8%,transparent);backdrop-filter:blur(5px);opacity:.7;transition:opacity .15s ease,transform .15s ease;display:none}#vaultControlTowerFab{right:max(94px,calc(env(safe-area-inset-right) + 94px));font-size:15px}#vaultGAdminFab{right:max(136px,calc(env(safe-area-inset-right) + 136px))}#vaultControlTowerFab.ready,#vaultGAdminFab.ready{display:grid}#vaultControlTowerFab:hover,#vaultControlTowerFab:focus,#vaultGAdminFab:hover,#vaultGAdminFab:focus{opacity:1;transform:scale(1.03)}#vaultControlTowerFab:disabled,#vaultGAdminFab:disabled{display:none}@media(max-width:620px){#vaultControlTowerFab,#vaultGAdminFab{bottom:max(8px,env(safe-area-inset-bottom));width:44px;height:44px;min-width:44px;min-height:44px}#vaultControlTowerFab{right:max(112px,calc(env(safe-area-inset-right) + 112px))}#vaultGAdminFab{right:max(164px,calc(env(safe-area-inset-right) + 164px))}}';document.head.appendChild(style);
 const make=(id,text,title)=>{const b=document.createElement('button');b.id=id;b.type='button';b.textContent=text;b.title=title;b.setAttribute('aria-label','Ouvrir '+title);b.disabled=true;document.body.appendChild(b);return b};
 const admin=make('vaultGAdminFab','A','GAdmin');const tower=make('vaultControlTowerFab','⌾','Control Tower');
 const liveSas=()=>{const runtime=document.querySelector('#gvaultRuntime'),pw=window.__GVAULT_PROJECT_STORE_PASSWORD__;return !!runtime?.classList.contains('ready')&&typeof pw==='string'&&pw.length>0};
 const sync=()=>{const ready=liveSas();for(const b of [admin,tower]){b.disabled=!ready;b.classList.toggle('ready',ready)}};
 const nonce=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');
 function openTool(button,{tool,url}){sync();if(button.disabled||!liveSas())return;const n=nonce(),target=new URL(url,location.href);target.searchParams.set('sas_nonce',n);const child=window.open(target.href,'_blank');if(!child){button.title='Ouverture bloquée par le navigateur';return}let accepted=false;const onMessage=ev=>{if(ev.origin!==location.origin||ev.source!==child)return;const d=ev.data||{};if(d.tool!==tool||d.nonce!==n)return;if(d.schema==='GVAULT_PRIVATE_TOOL_SAS_REQUEST_V1'){if(!liveSas())return;const pw=window.__GVAULT_PROJECT_STORE_PASSWORD__;child.postMessage({schema:'GVAULT_PRIVATE_TOOL_SAS_SESSION_V1',tool,nonce:n,password:pw},location.origin)}else if(d.schema==='GVAULT_PRIVATE_TOOL_SAS_ACCEPTED_V1'){accepted=true}};window.addEventListener('message',onMessage);const timer=setInterval(()=>{if(child.closed||!liveSas()){clearInterval(timer);window.removeEventListener('message',onMessage);if(!child.closed&&!accepted)try{child.close()}catch{}}},750);setTimeout(()=>{if(!accepted){clearInterval(timer);window.removeEventListener('message',onMessage);try{if(!child.closed)child.close()}catch{}}},25000)}
 admin.addEventListener('click',()=>openTool(admin,{tool:'gadmin',url:'./essai/gadmin/'}));
 tower.addEventListener('click',()=>openTool(tower,{tool:'control-tower',url:'./essai/control-tower/v2.html'}));
 sync();const timer=setInterval(sync,350);window.addEventListener('pageshow',sync);window.addEventListener('pagehide',()=>clearInterval(timer),{once:true});
}
if(document.readyState==='loading')window.addEventListener('DOMContentLoaded',installPrivateToolEntries,{once:true});else installPrivateToolEntries();`;
if(!h.includes(needle))throw new Error('Point de greffe outils privés introuvable');
h=h.replace(needle,graft);
if(!h.includes('gvault-public-agent-conversation.js')){
 const agentStyle='<script src="./scripts/gvault-public-agent-conversation.js?v=2"><\/script>\n';
 const documentClose='<'+'/body>\n<'+'/html>';
 h=h.replace(/<\/body>\s*<\/html>\s*$/i,agentStyle+documentClose);
}
document.open();document.write(h);document.close();
})().catch(e=>{const s=document.getElementById('state');if(s){s.classList.add('err');s.textContent='GVAULT INDISPONIBLE · '+String(e&&e.message||e)}console.error(e)});
</script>
