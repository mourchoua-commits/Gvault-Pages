<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>GVAULT · ESSAI · Stable + GAdmin + Control Tower session handoff</title>
<style>html,body{margin:0;min-height:100%;background:#060806;color:#d9d3c2;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{display:grid;place-items:center;padding:20px}.boot{max-width:560px;border:1px solid #555546;border-radius:14px;padding:18px;background:#0c0f0c}.boot b{color:#c8a95a}.state{margin-top:10px;font-size:12px;line-height:1.5;color:#a9a28f}.err{color:#ff8f8f}</style>
</head>
<body>
<div class="boot"><b>GVAULT · ESSAI</b><div class="state" id="state">Chargement du runtime Stable épinglé…</div></div>
<script>
(async()=>{
'use strict';
const BASE_COMMIT='fb5ab4a1d9e7f8d1dc382ce3ac89248c4c44a07d';
const BASE_URL='https://raw.githubusercontent.com/mourchoua-commits/Gvault-Pages/'+BASE_COMMIT+'/index.html';
const r=await fetch(BASE_URL,{cache:'no-store',credentials:'omit'});
if(!r.ok)throw new Error('Baseline gateway HTTP '+r.status);
let h=await r.text();
if(!/^\s*<!doctype html>/i.test(h)||!/<\/html>\s*$/i.test(h))throw new Error('Baseline gateway incomplet');
const needle='const nativeFetch=window.fetch.bind(window);';
const graft=`const nativeFetch=window.fetch.bind(window);
const GVAULT_CONTROL_TOWER_ENTRY_KEY='gvault.controlTower.entry.v1';
const GVAULT_GADMIN_ENTRY_KEY='gvault.gadmin.entry.v1';
try{sessionStorage.removeItem(GVAULT_CONTROL_TOWER_ENTRY_KEY);sessionStorage.removeItem(GVAULT_GADMIN_ENTRY_KEY)}catch{}
function installPrivateToolEntries(){
 if(document.getElementById('vaultControlTowerFab')||document.getElementById('vaultGAdminFab'))return;
 const style=document.createElement('style');style.setAttribute('data-gvault-private-tool-entries','V3');style.textContent='#vaultControlTowerFab,#vaultGAdminFab{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));z-index:93;width:34px;height:34px;min-width:34px;min-height:34px;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 48%,var(--line));background:color-mix(in srgb,var(--panel1) 78%,transparent);color:var(--accent);place-items:center;padding:0;font:900 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;box-shadow:0 6px 24px rgba(0,0,0,.34),0 0 18px color-mix(in srgb,var(--accent) 8%,transparent);backdrop-filter:blur(5px);opacity:.7;transition:opacity .15s ease,transform .15s ease;display:none}#vaultControlTowerFab{right:max(94px,calc(env(safe-area-inset-right) + 94px));font-size:15px}#vaultGAdminFab{right:max(136px,calc(env(safe-area-inset-right) + 136px))}#vaultControlTowerFab.ready,#vaultGAdminFab.ready{display:grid}#vaultControlTowerFab:hover,#vaultControlTowerFab:focus,#vaultGAdminFab:hover,#vaultGAdminFab:focus{opacity:1;transform:scale(1.03)}#vaultControlTowerFab:disabled,#vaultGAdminFab:disabled{display:none}@media(max-width:620px){#vaultControlTowerFab,#vaultGAdminFab{bottom:max(8px,env(safe-area-inset-bottom));width:44px;height:44px;min-width:44px;min-height:44px}#vaultControlTowerFab{right:max(112px,calc(env(safe-area-inset-right) + 112px))}#vaultGAdminFab{right:max(164px,calc(env(safe-area-inset-right) + 164px))}}';document.head.appendChild(style);
 const make=(id,text,title)=>{const b=document.createElement('button');b.id=id;b.type='button';b.textContent=text;b.title=title;b.setAttribute('aria-label','Ouvrir '+title);b.disabled=true;document.body.appendChild(b);return b};
 const admin=make('vaultGAdminFab','A','GAdmin');const tower=make('vaultControlTowerFab','⌾','Control Tower');
 const sync=()=>{const runtime=document.querySelector('#gvaultRuntime');const ready=!!runtime?.classList.contains('ready')&&typeof window.__GVAULT_PROJECT_STORE_PASSWORD__==='string'&&window.__GVAULT_PROJECT_STORE_PASSWORD__.length>0;for(const b of [admin,tower]){b.disabled=!ready;b.classList.toggle('ready',ready)}};
 const assertion=(key,schema)=>{const b=crypto.getRandomValues(new Uint8Array(16)),nonce=Array.from(b,x=>x.toString(16).padStart(2,'0')).join(''),proof={schema,source:'GVAULT_SAS_READY',issuedAt:Date.now(),nonce,origin:location.origin};sessionStorage.setItem(key,JSON.stringify(proof));return proof};
 function openTool(button,{key,schema,tool,url}){sync();if(button.disabled)return;const password=window.__GVAULT_PROJECT_STORE_PASSWORD__;if(typeof password!=='string'||!password)return;let proof;try{proof=assertion(key,schema)}catch{return}const target=new URL(url,location.href);target.searchParams.set('sas_nonce',proof.nonce);const child=window.open(target.href,'_blank');if(!child){button.title='Ouverture bloquée par le navigateur';return}let done=false;const cleanup=()=>{if(done)return;done=true;window.removeEventListener('message',onMessage);clearTimeout(timer)};const onMessage=ev=>{if(ev.origin!==location.origin||ev.source!==child)return;const d=ev.data||{};if(d.tool!==tool||d.nonce!==proof.nonce)return;if(d.schema==='GVAULT_PRIVATE_TOOL_SAS_REQUEST_V1'){const runtime=document.querySelector('#gvaultRuntime'),pw=window.__GVAULT_PROJECT_STORE_PASSWORD__;if(!runtime?.classList.contains('ready')||typeof pw!=='string'||!pw)return;child.postMessage({schema:'GVAULT_PRIVATE_TOOL_SAS_SESSION_V1',tool,nonce:proof.nonce,password:pw},location.origin)}else if(d.schema==='GVAULT_PRIVATE_TOOL_SAS_ACCEPTED_V1')cleanup()};window.addEventListener('message',onMessage);const timer=setTimeout(cleanup,45000)}
 admin.addEventListener('click',()=>openTool(admin,{key:GVAULT_GADMIN_ENTRY_KEY,schema:'GVAULT_GADMIN_ENTRY_V1',tool:'gadmin',url:'./essai/gadmin/'}));
 tower.addEventListener('click',()=>openTool(tower,{key:GVAULT_CONTROL_TOWER_ENTRY_KEY,schema:'GVAULT_CONTROL_TOWER_ENTRY_V1',tool:'control-tower',url:'./essai/control-tower/v2.html'}));
 sync();const timer=setInterval(sync,500);window.addEventListener('pagehide',()=>clearInterval(timer),{once:true});
}
if(document.readyState==='loading')window.addEventListener('DOMContentLoaded',installPrivateToolEntries,{once:true});else installPrivateToolEntries();`;
if(!h.includes(needle))throw new Error('Point de greffe outils privés introuvable');
h=h.replace(needle,graft);
document.open();document.write(h);document.close();
})().catch(e=>{const s=document.getElementById('state');if(s){s.classList.add('err');s.textContent='GVAULT INDISPONIBLE · '+String(e&&e.message||e)}console.error(e)});
</script>
</body>
</html>
