<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>GVAULT · ESSAI · chargement Stable</title>
<style>html,body{margin:0;min-height:100%;background:#060806;color:#d9d3c2;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{display:grid;place-items:center;padding:20px}.boot{max-width:560px;border:1px solid #555546;border-radius:14px;padding:18px;background:#0c0f0c}.boot b{color:#c8a95a}.state{margin-top:10px;font-size:12px;line-height:1.5;color:#a9a28f}.err{color:#ff8f8f}</style>
</head>
<body>
<div class="boot"><b>GVAULT · ESSAI</b><div class="state" id="state">Chargement du runtime Stable épinglé…</div></div>
<script>
(async()=>{
'use strict';
const STABLE_COMMIT='bb36cd4d328ca8c4ee94aae6fd1a2e5c63bac4e1';
const STABLE_RAW='https://raw.githubusercontent.com/mourchoua-commits/GvaultStable/'+STABLE_COMMIT+'/';
const STABLE_INDEX=STABLE_RAW+'index.html';
const CATALOG_MANIFEST=STABLE_RAW+'private-catalog/manifest.json';
const CATALOG_PAYLOAD=STABLE_RAW+'private-catalog/catalog.23243b824fe7935796256982ebb1982f22477edcd0e6d339a74bc69c705eecdc.bin';
const state=document.getElementById('state');
const r=await fetch(STABLE_INDEX,{cache:'no-store',credentials:'omit'});
if(!r.ok)throw new Error('Stable index HTTP '+r.status);
const html=await r.text();
if(!/^\s*<!doctype html>/i.test(html)||!/<\/html>\s*$/i.test(html))throw new Error('Stable index incomplet');
const bridge=`<script data-gvault-pages-essai-bridge="GVAULT_PAGES_STABLE_MIRROR_V1">(()=>{'use strict';const nativeFetch=window.fetch.bind(window);const stableCommit='${STABLE_COMMIT}';const manifestUrl='${CATALOG_MANIFEST}';const payloadUrl='${CATALOG_PAYLOAD}';window.GVAULT_ESSAI_BASELINE=Object.freeze({schema:'GVAULT_PAGES_ESSAI_BASELINE_V1',sourceRepository:'mourchoua-commits/GvaultStable',sourceCommit:stableCommit,executionOrigin:location.origin,stableMutable:false});window.fetch=(input,init)=>{let u;try{u=new URL(typeof input==='string'?input:input.url,location.href)}catch{return nativeFetch(input,init)};if(u.origin===location.origin&&u.pathname.endsWith('/private-catalog/manifest.json'))return nativeFetch(manifestUrl,{...(init||{}),credentials:'omit'});if(u.origin===location.origin&&u.pathname.endsWith('/private-catalog/catalog.23243b824fe7935796256982ebb1982f22477edcd0e6d339a74bc69c705eecdc.bin'))return nativeFetch(payloadUrl,{...(init||{}),credentials:'omit'});return nativeFetch(input,init)};})();<\/script>`;
const head=html.search(/<head(?:\s[^>]*)?>/i);
if(head<0)throw new Error('Stable <head> introuvable');
const end=html.indexOf('>',head)+1;
const mirrored=html.slice(0,end)+bridge+html.slice(end);
document.open();document.write(mirrored);document.close();
})().catch(e=>{const s=document.getElementById('state');if(s){s.classList.add('err');s.textContent='BASELINE STABLE INDISPONIBLE · '+String(e&&e.message||e)}console.error(e)});
</script>
</body>
</html>
