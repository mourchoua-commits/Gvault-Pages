<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Monde vivant v3 · solo musical</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#050508; color:#dbdee1; font-family:'Segoe UI',system-ui,sans-serif; min-height:100dvh; display:flex; flex-direction:column; align-items:center; gap:10px; padding:14px; }
  h1 { font-size:20px; background:linear-gradient(90deg,#5865f2,#eb459e); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  #bar { display:flex; gap:5px; flex-wrap:wrap; justify-content:center; max-width:96vw; }
  #bar .mat { padding:4px 8px; border:1px solid rgba(255,255,255,.15); border-radius:12px; background:rgba(255,255,255,.05); color:#dbdee1; cursor:pointer; font-size:12px; }
  #bar .mat.active { border-color:#5865f2; background:rgba(88,101,242,.35); color:#fff; }
  #bar .wbtn { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); color:#dbdee1; border-radius:8px; padding:6px 10px; cursor:pointer; font-size:13px; }
  #bar .wbtn.on { border-color:#57f287; color:#57f287; }
  canvas { background:#0a0a14; border:1px solid rgba(255,255,255,.15); border-radius:8px; touch-action:none; max-width:96vw; cursor:crosshair; image-rendering:pixelated; }
  #status { color:#949ba4; font-size:13px; min-height:18px; }
  #help { color:#6d6f78; font-size:12px; max-width:640px; text-align:center; }
</style>
</head>
<body>
<h1>🪐 Monde vivant v3 · solo musical</h1>
<div id="bar"></div>
<canvas id="cv" width="576" height="384"></canvas>
<div id="status"></div>
<div id="help">Chaque matière joue une note différente (pentatonique). Peins, puis lance la boucle : le monde devient un séquenceur, 16 bandes en boucle. Clic = peindre, clic droit = effacer.</div>
<script>
'use strict';
// ---------- Constantes ----------
const W = 96, H = 64, CELL = 6;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const status = document.getElementById('status');

// Pentatonique La mineur sur 3 octaves (répétée) : chaque matière a sa note
const PENTA = [0, 3, 5, 7, 10];
const noteFreq = i => 220 * Math.pow(2, (PENTA[i % 5] + 12 * Math.floor(i / 5)) / 12);

// ---------- Matières ----------
// kind: powder | liquid | gas | solid | life | fire | void
const MATS = [
  { id:'vide',    name:'Vide',    color:'#0a0a14', kind:'void'   },
  { id:'sable',   name:'Sable',   color:'#e2c290', kind:'powder' },
  { id:'eau',     name:'Eau H2O', color:'#3b82f6', kind:'liquid' },
  { id:'huile',   name:'Pétrole', color:'#3f3f46', kind:'liquid' },
  { id:'lave',    name:'Lave',    color:'#f97316', kind:'liquid' },
  { id:'vapeur',  name:'Vapeur',  color:'#cbd5e1', kind:'gas'    },
  { id:'glace',   name:'Glace',   color:'#a5f3fc', kind:'solid'  },
  { id:'pierre',  name:'Pierre',  color:'#78716c', kind:'solid'  },
  { id:'bois',    name:'Bois',    color:'#92400e', kind:'solid'  },
  { id:'charbon', name:'Charbon', color:'#1c1917', kind:'solid'  },
  { id:'plante',  name:'Plante',  color:'#22c55e', kind:'life'   },
  { id:'graine',  name:'Graine',  color:'#a3e635', kind:'powder' },
  { id:'feu',     name:'Feu',     color:'#ef4444', kind:'fire'   },
  { id:'or',      name:'Or Au',   color:'#facc15', kind:'powder' },
  { id:'argent',  name:'Argent Ag',color:'#e5e7eb', kind:'powder' },
  { id:'fer',     name:'Fer Fe',  color:'#b45309', kind:'powder' },
  { id:'cuivre',  name:'Cuivre Cu',color:'#fb923c', kind:'powder' },
  { id:'mercure', name:'Mercure Hg',color:'#94a3b8', kind:'liquid' },
  { id:'soufre',  name:'Soufre S',color:'#fde047', kind:'powder' },
  { id:'sel',     name:'Sel NaCl',color:'#f8fafc', kind:'powder' },
  { id:'oxy',     name:'O2',      color:'#7dd3fc', kind:'gas'    },
  { id:'azote',   name:'N2',      color:'#a5b4fc', kind:'gas'    },
  { id:'chlore',  name:'Cl2',     color:'#bef264', kind:'gas'    },
  { id:'helium',  name:'He',      color:'#fda4af', kind:'gas'    },
  { id:'neon',    name:'Ne',      color:'#f472b6', kind:'gas'    },
  { id:'hydrogen',name:'H2',      color:'#d8b4fe', kind:'gas'    }
];
MATS.forEach((m, i) => m.note = noteFreq(i));

const grid = new Uint8Array(W * H);
const gi = (x, y) => y * W + x;
const inB = (x, y) => x >= 0 && x < W && y >= 0 && y < H;
let cur = 1, brush = 2, paused = false, loopOn = false;

// ---------- Audio ----------
let AC = null;
function audio() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; }
function pluck(freq, when, dur, vol) {
  const ac = audio(), t = when ?? ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol ?? 0.18, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + (dur ?? 0.25));
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + (dur ?? 0.25) + 0.05);
}

// ---------- Simulation ----------
function step() {
  const moved = new Uint8Array(W * H);
  for (let y = H - 1; y >= 0; y--) {
    const dir = Math.random() < 0.5 ? 1 : -1;
    for (let n = 0; n < W; n++) {
      const x = dir > 0 ? n : W - 1 - n;
      const i = gi(x, y), m = grid[i];
      if (!m || moved[i]) continue;
      const mat = MATS[m];
      if (mat.kind === 'powder' || mat.kind === 'liquid') {
        const below = inB(x, y + 1) ? grid[gi(x, y + 1)] : 1;
        if (!below || MATS[below].kind === 'gas' || (mat.kind === 'liquid' && MATS[below].kind === 'gas')) {
          grid[gi(x, y + 1)] = m; grid[i] = below; moved[gi(x, y + 1)] = 1; continue;
        }
        const s = dir > 0 ? 1 : -1;
        for (const dx of [s, -s]) {
          if (inB(x + dx, y + 1) && !grid[gi(x + dx, y + 1)]) {
            grid[gi(x + dx, y + 1)] = m; grid[i] = 0; moved[gi(x + dx, y + 1)] = 1; break;
          }
        }
      } else if (mat.kind === 'gas') {
        if (y > 0 && !grid[gi(x, y - 1)]) {
          grid[gi(x, y - 1)] = m; grid[i] = 0; moved[gi(x, y - 1)] = 1;
        } else {
          const dx = Math.random() < 0.5 ? 1 : -1;
          if (inB(x + dx, y - 1) && !grid[gi(x + dx, y - 1)]) {
            grid[gi(x + dx, y - 1)] = m; grid[i] = 0; moved[gi(x + dx, y - 1)] = 1;
          }
        }
      } else if (mat.kind === 'fire') {
        // le feu monte brièvement puis disparaît
        if (Math.random() < 0.7) {
          const dx = Math.floor(Math.random() * 3) - 1, dy = -1 - (Math.random() < 0.3 ? 1 : 0);
          if (inB(x + dx, y + dy)) {
            const j = gi(x + dx, y + dy), t = grid[j];
            if (!t) { grid[j] = m; grid[i] = 0; }
            else if (MATS[t].kind === 'life' || MATS[t].kind === 'solid' && MATS[t].id === 'bois' || MATS[t].id === 'charbon' || MATS[t].id === 'huile') {
              grid[j] = 0; // brûle
              if (Math.random() < 0.2) grid[i] = 5; // devient vapeur
            }
          }
        } else grid[i] = 0;
      } else if (mat.kind === 'life') {
        // la plante pousse si de l'eau est à côté
        for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          if (inB(x + dx, y + dy) && MATS[grid[gi(x + dx, y + dy)]]?.id === 'eau' && Math.random() < 0.02) {
            if (inB(x, y - 1) && !grid[gi(x, y - 1)]) { grid[gi(x, y - 1)] = m; break; }
          }
        }
      }
      // réactions lave + eau -> pierre + vapeur
      if (mat.id === 'lave') {
        for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          if (inB(x + dx, y + dy) && MATS[grid[gi(x + dx, y + dy)]]?.id === 'eau') {
            grid[gi(x + dx, y + dy)] = 7; // pierre
            grid[i] = 5; // vapeur
            break;
          }
        }
      }
      // graine + eau -> plante
      if (mat.id === 'graine') {
        for (const [dx, dy] of [[0,1],[1,0],[-1,0]]) {
          if (inB(x + dx, y + dy) && MATS[grid[gi(x + dx, y + dy)]]?.id === 'eau' && Math.random() < 0.05) {
            grid[i] = 11; break;
          }
        }
      }
    }
  }
}

function draw() {
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const m = grid[gi(x, y)];
    ctx.fillStyle = m ? MATS[m].color : '#0a0a14';
    ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
  }
}

let tick = 0;
function loop() {
  if (!paused) { step(); step(); }
  draw();
  requestAnimationFrame(loop);
}

// ---------- Boucle musicale : 16 bandes horizontales = 16 pas ----------
const BANDS = 16, STEP_MS = 160;
let loopTimer = null, stepIdx = 0;
function playLoop() {
  loopOn = !loopOn;
  document.querySelector('#loopBtn').classList.toggle('on', loopOn);
  status.textContent = loopOn ? '🎵 boucle en cours (16 bandes)' : '';
  if (loopTimer) { clearInterval(loopTimer); loopTimer = null; return; }
  loopTimer = setInterval(() => {
    const y0 = Math.floor(stepIdx * H / BANDS), y1 = Math.floor((stepIdx + 1) * H / BANDS);
    const notes = new Set();
    for (let y = y0; y < y1; y++) for (let x = 0; x < W; x++) {
      const m = grid[gi(x, y)];
      if (m) notes.add(MATS[m].note);
    }
    const t = audio().currentTime;
    notes.forEach(f => pluck(f, t, 0.3, 0.12));
    stepIdx = (stepIdx + 1) % BANDS;
  }, STEP_MS);
}

// ---------- UI ----------
const bar = document.getElementById('bar');
MATS.forEach((m, i) => {
  const b = document.createElement('button');
  b.className = 'mat' + (i === cur ? ' active' : '');
  b.textContent = m.name;
  b.style.borderLeft = '4px solid ' + m.color;
  b.title = 'note: ' + Math.round(m.note) + ' Hz';
  b.onclick = () => { cur = i; document.querySelectorAll('.mat').forEach(x => x.classList.remove('active')); b.classList.add('active'); pluck(m.note); };
  b.dataset.i = i;
  bar.appendChild(b);
});
function addBtn(id, label, fn) {
  const b = document.createElement('button');
  b.className = 'wbtn'; b.id = id; b.textContent = label; b.onclick = fn;
  bar.appendChild(b); return b;
}
addBtn('pauseBtn', '⏸ Pause', () => { paused = !paused; document.getElementById('pauseBtn').textContent = paused ? '▶️ Reprendre' : '⏸ Pause'; });
addBtn('loopBtn', '🎵 Boucle', playLoop);
addBtn('clearBtn', '🗑 Clear', () => grid.fill(0));
addBtn('terraBtn', '🌋 Terrain', () => {
  grid.fill(0);
  for (let x = 0; x < W; x++) {
    const h = 18 + Math.floor(8 * Math.sin(x / 8) + Math.random() * 3);
    for (let y = H - h; y < H; y++) grid[gi(x, y)] = y > H - 4 ? 7 : 1;
  }
  for (let i = 0; i < 40; i++) grid[gi(2 + Math.floor(Math.random() * (W - 4)), H - 20 - Math.floor(Math.random() * 10))] = 11;
});
addBtn('pngBtn', '📷 PNG', () => {
  const a = document.createElement('a');
  a.download = 'monde-vivant.png'; a.href = cv.toDataURL('image/png'); a.click();
});

// ---------- Pinceau ----------
function paint(e, erase) {
  const r = cv.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / r.width * W);
  const y = Math.floor((e.clientY - r.top) / r.height * H);
  for (let dy = -brush + 1; dy < brush; dy++) for (let dx = -brush + 1; dx < brush; dx++) {
    if (dx * dx + dy * dy > brush * brush) continue;
    if (inB(x + dx, y + dy)) {
      grid[gi(x + dx, y + dy)] = erase ? 0 : cur;
      if (!erase && MATS[cur].kind !== 'void') pluck(MATS[cur].note, undefined, 0.15, 0.08);
    }
  }
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); paint(e, e.button === 2); });
cv.addEventListener('pointermove', e => { if (e.buttons) paint(e, (e.buttons & 2) !== 0); });
cv.addEventListener('contextmenu', e => e.preventDefault());
addBtn('brushBtn', '🖌 x' + brush, () => { brush = brush % 5 + 1; document.getElementById('brushBtn').textContent = '🖌 x' + brush; });

// terrain de départ
grid.fill(0);
for (let x = 0; x < W; x++) {
  const h = 16 + Math.floor(6 * Math.sin(x / 7));
  for (let y = H - h; y < H; y++) grid[gi(x, y)] = 1;
}
loop();
</script>
</body>
</html>
