<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grid Method B · Microgrid</title><style>*{box-sizing:border-box}html,body{margin:0;background:#080a08;color:#eee7d6;font:12px ui-monospace,monospace}.case{padding:12px}.label{margin-bottom:10px;font-weight:900}.surface{position:relative;border:1px solid #4c4b40;border-radius:12px;padding:12px;overflow:hidden;background-image:linear-gradient(to right,rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.025) 1px,transparent 1px);background-size:4px 4px}.controls{position:relative;width:100%}.item,.state{position:absolute;margin:0}.item{min-width:44px;min-height:44px;padding:0 12px;border:1px solid #655d43;border-radius:9px;background:#11150f;color:#dfd7c2;font:850 10px ui-monospace,monospace;white-space:nowrap}.state{min-height:44px;padding:10px;border:1px solid #383b34;border-radius:9px;background:#0d100d}.note{margin-top:10px;font-size:10px;color:#aaa38f}</style></head><body><main class="case"><div class="label">B · MICRO-GRID 4PX · OCCUPATION + GUTTERS</div><section id="surface" class="surface"><div id="controls" class="controls"><button class="item" data-item>RECHARGER BLOP</button><button class="item" data-item>SCELLER MAINTENANT</button><button class="item" data-item>TENTER PASSAGE</button><button class="item" data-item>ACTUALISER ÉTAT</button><button class="item" data-item>ANALYSE</button><button class="item" data-item>DISSECTION</button><button class="item" data-item>RÉFÉRENCEMENT</button><button class="item" data-item>EXAMEN COMPLET</button><div class="state" data-item>VFS · événements 37 · capsules 2 · LOCAL_OUTBOX · transport LOCAL UNIQUEMENT</div></div></section><div class="note">Placement sur grille d’occupation 4 px ; 12 px réservés entre cellules occupées ; aucune collision autorisée.</div></main><script>(()=>{const U=4,G=3;function place(){const box=document.querySelector('#controls'),surface=document.querySelector('#surface'),items=[...box.querySelectorAll('[data-item]')],cols=Math.max(1,Math.floor(box.clientWidth/U)),occ=[];let maxRow=0;const fits=(c,r,w,h)=>{if(c+w>cols)return false;for(let y=r-G;y<r+h+G;y++)for(let x=c-G;x<c+w+G;x++)if(y>=0&&x>=0&&x<cols&&occ[y]?.[x])return false;return true};const mark=(c,r,w,h)=>{for(let y=Math.max(0,r-G);y<r+h+G;y++){occ[y]??=[];for(let x=Math.max(0,c-G);x<Math.min(cols,c+w+G);x++)occ[y][x]=1}};for(const el of items){el.style.width='auto';el.style.height='auto';const natural=Math.max(44,el.scrollWidth+2),hpx=Math.max(44,el.scrollHeight+2),w=Math.min(cols,Math.ceil(natural/U)),h=Math.ceil(hpx/U);let found=null;for(let r=0;!found&&r<200;r++)for(let c=0;c<cols;c++)if(fits(c,r,w,h)){found={c,r,w,h};break}if(!found)found={c:0,r:maxRow+G,w:Math.min(cols,w),h};mark(found.c,found.r,found.w,found.h);el.style.left=(found.c*U)+'px';el.style.top=(found.r*U)+'px';el.style.width=(found.w*U)+'px';el.style.height=(found.h*U)+'px';maxRow=Math.max(maxRow,found.r+found.h)}box.style.height=(maxRow*U)+'px';surface.style.minHeight=(maxRow*U+24)+'px';setTimeout(report,0)}function report(){const s=document.querySelector('#surface'),items=[...document.querySelectorAll('[data-item]')],r=items.map(x=>x.getBoundingClientRect()),sr=s.getBoundingClientRect();let overlaps=0,minGap=1e9;for(let i=0;i<r.length;i++)for(let j=i+1;j<r.length;j++){const a=r[i],b=r[j],ox=Math.min(a.right,b.right)-Math.max(a.left,b.left),oy=Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top);if(ox>0&&oy>0)overlaps++;else{const gx=Math.max(0,Math.max(a.left,b.left)-Math.min(a.right,b.right)),gy=Math.max(0,Math.max(a.top,b.top)-Math.min(a.bottom,b.bottom));const g=Math.max(gx,gy);if(g<minGap)minGap=g}}const touch=r.filter(x=>x.width<44||x.height<44).length,overflow=Math.max(0,s.scrollWidth-s.clientWidth),area=r.reduce((n,x)=>n+x.width*x.height,0),density=area/Math.max(1,sr.width*sr.height);window.GRID_METHOD_REPORT={schema:'GVAULT_GRID_METHOD_REPORT_V1',method:'microgrid-4px',width:innerWidth,overlaps,horizontalOverflow:overflow,touchViolations:touch,minGapPx:Number.isFinite(minGap)?Math.round(minGap):null,density:Number(density.toFixed(3)),surfaceHeight:Math.round(sr.height),items:r.length,unitPx:U,gutterPx:G*U};return window.GRID_METHOD_REPORT}window.measureGridMethod=report;addEventListener('resize',()=>requestAnimationFrame(place));requestAnimationFrame(place)})();</script></body></html>
