<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grid Method A · Baseline</title><style>*{box-sizing:border-box}html,body{margin:0;background:#080a08;color:#eee7d6;font:12px ui-monospace,monospace}.case{padding:12px}.label{margin-bottom:10px;font-weight:900}.surface{border:1px solid #4c4b40;border-radius:12px;padding:12px;overflow:hidden}.controls{display:flex;flex-wrap:wrap;gap:12px}.item{min-height:44px;padding:0 12px;border:1px solid #655d43;border-radius:9px;background:#11150f;color:#dfd7c2;font:850 10px ui-monospace,monospace}.state{margin-top:12px;min-height:44px;padding:10px;border:1px solid #383b34;border-radius:9px}.note{margin-top:10px;font-size:10px;color:#aaa38f}</style></head><body><main class="case"><div class="label">A · MÉTHODE ACTUELLE · FLEX + WRAP</div><section id="surface" class="surface"><div id="controls" class="controls"><button class="item" data-item>RECHARGER BLOP</button><button class="item" data-item>SCELLER MAINTENANT</button><button class="item" data-item>TENTER PASSAGE</button><button class="item" data-item>ACTUALISER ÉTAT</button><button class="item" data-item>ANALYSE</button><button class="item" data-item>DISSECTION</button><button class="item" data-item>RÉFÉRENCEMENT</button><button class="item" data-item>EXAMEN COMPLET</button></div><div class="state" data-item>VFS · événements 37 · capsules 2 · LOCAL_OUTBOX · transport LOCAL UNIQUEMENT</div></section><div class="note">Placement manuel par flex-wrap ; espacement explicite mais sans grille d’occupation.</div></main><script>(()=>{function report(){const s=document.querySelector('#surface'),items=[...document.querySelectorAll('[data-item]')],r=items.map(x=>x.getBoundingClientRect()),sr=s.getBoundingClientRect();let overlaps=0,minGap=1e9;for(let i=0;i<r.length;i++)for(let j=i+1;j<r.length;j++){const a=r[i],b=r[j],ox=Math.min(a.right,b.right)-Math.max(a.left,b.left),oy=Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top);if(ox>0&&oy>0)overlaps++;else{const gx=Math.max(0,Math.max(a.left,b.left)-Math.min(a.right,b.right)),gy=Math.max(0,Math.max(a.top,b.top)-Math.min(a.bottom,b.bottom));const g=Math.max(gx,gy);if(g<minGap)minGap=g}}const touch=r.filter(x=>x.width<44||x.height<44).length,overflow=Math.max(0,s.scrollWidth-s.clientWidth),area=r.reduce((n,x)=>n+x.width*x.height,0),density=area/Math.max(1,sr.width*sr.height);window.GRID_METHOD_REPORT={schema:'GVAULT_GRID_METHOD_REPORT_V1',method:'baseline-flex',width:innerWidth,overlaps,horizontalOverflow:overflow,touchViolations:touch,minGapPx:Number.isFinite(minGap)?Math.round(minGap):null,density:Number(density.toFixed(3)),surfaceHeight:Math.round(sr.height),items:r.length};return window.GRID_METHOD_REPORT}window.measureGridMethod=report;addEventListener('resize',()=>setTimeout(report,20));setTimeout(report,60)})();</script></body></html>
