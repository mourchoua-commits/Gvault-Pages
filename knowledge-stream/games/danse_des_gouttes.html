<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Danse des gouttes — Gvault</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#08131f;color:#eef7ff;min-height:100vh;display:grid;place-items:center}.app{width:min(100%,620px);padding:16px}.panel{background:#0d2032;border:1px solid #31516d;border-radius:18px;padding:14px}h1{font-size:1.25rem;margin:0 0 6px}.sub{opacity:.78;font-size:.9rem;margin-bottom:10px}.hud{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.chip{background:#142d43;padding:7px 10px;border-radius:999px;font-size:.85rem}#world{position:relative;height:420px;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 100%,#174366,#091826 70%)}.drop{position:absolute;border-radius:50%;border:2px solid #d8f4ff;background:radial-gradient(circle at 35% 28%,#fff,#72d6ff 25%,#238fc7 70%);box-shadow:0 0 18px #55cfff88;display:grid;place-items:center;color:#06243a;font-weight:800;user-select:none;cursor:pointer}.drop.selected{transform:scale(1.15);filter:brightness(1.35)}button{width:100%;margin-top:10px;border:0;border-radius:12px;padding:12px;font-weight:700;background:#d7f3ff;color:#082033}.msg{min-height:24px;margin-top:8px}</style></head><body><main class="app"><section class="panel"><h1>Danse des gouttes</h1><div class="sub">Fusionne deux gouttes du même niveau. Atteins le niveau 5 en créant le moins de satellites possible.</div><div class="hud"><span class="chip">Score <b id="score">0</b></span><span class="chip">Satellites <b id="sat">0</b></span><span class="chip">Record <b id="best">0</b></span></div><div id="world"></div><div class="msg" id="msg"></div><button id="reset">Nouvelle danse</button></section></main><script>const world=document.querySelector('#world'),scoreEl=document.querySelector('#score'),satEl=document.querySelector('#sat'),bestEl=document.querySelector('#best'),msg=document.querySelector('#msg');let drops=[],selected=null,score=0,sat=0,nextId=1,best=Number(localStorage.gvaultDropBest||0);bestEl.textContent=best;const size=l=>28+l*12;function rand(n){return Math.random()*n}function make(level=1,x=rand(520),y=rand(340)){const d={id:nextId++,level,x,y};drops.push(d);return d}function render(){world.innerHTML='';const w=world.clientWidth,h=world.clientHeight;for(const d of drops){const el=document.createElement('div'),s=size(d.level);d.x=Math.max(0,Math.min(d.x,w-s));d.y=Math.max(0,Math.min(d.y,h-s));el.className='drop'+(selected===d.id?' selected':'');el.style.cssText=`width:${s}px;height:${s}px;left:${d.x}px;top:${d.y}px`;el.textContent=d.level;el.onclick=()=>pick(d.id);world.appendChild(el)}scoreEl.textContent=score;satEl.textContent=sat;bestEl.textContent=best}function pick(id){const d=drops.find(x=>x.id===id);if(!d)return;if(selected==null){selected=id;render();return}if(selected===id){selected=null;render();return}const a=drops.find(x=>x.id===selected);selected=null;if(!a){render();return}if(a.level!==d.level){sat++;msg.textContent='Niveaux différents : une goutte satellite apparaît.';make(1,(a.x+d.x)/2+rand(35),(a.y+d.y)/2+rand(35));render();return}const nl=a.level+1,mx=(a.x+d.x)/2,my=(a.y+d.y)/2;drops=drops.filter(x=>x.id!==a.id&&x.id!==d.id);make(nl,mx,my);score+=nl*10;if(score>best){best=score;localStorage.gvaultDropBest=best}msg.textContent=nl>=5?'Niveau 5 atteint : production réussie.':`Fusion propre → niveau ${nl}.`;while(drops.length<6)make(Math.random()<.25?2:1);render()}function reset(){drops=[];selected=null;score=0;sat=0;nextId=1;msg.textContent='Choisis une première goutte.';for(let i=0;i<7;i++)make(i<2?2:1);render()}document.querySelector('#reset').onclick=reset;addEventListener('resize',render);reset();</script></body></html>
