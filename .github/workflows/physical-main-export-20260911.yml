name: Physical exact public main backup

on:
  push:
    branches:
      - backup/physical-export-20260911-1919

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PUBLIC_SHA: ad845a655371d1ff1e154c5a76ae905fa5936506
    steps:
      - name: Checkout exact public source with full history LFS and submodules
        uses: actions/checkout@v4
        with:
          repository: mourchoua-commits/Gvault-Pages
          ref: ad845a655371d1ff1e154c5a76ae905fa5936506
          fetch-depth: 0
          lfs: true
          submodules: recursive
          path: src

      - name: Build and verify physical backups
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C src rev-parse HEAD)" = "$PUBLIC_SHA"
          mkdir -p out stage/mirror/submodules

          if command -v git-lfs >/dev/null 2>&1 && [ -n "$(git -C src lfs ls-files 2>/dev/null || true)" ]; then
            git -C src lfs pull
            git -C src lfs fetch --all origin
            git -C src lfs fsck
          fi

          git -C src submodule status --recursive > out/Gvault-Pages-public-SUBMODULES.txt || true
          if grep -Eq '^[+-U]' out/Gvault-Pages-public-SUBMODULES.txt; then
            echo 'Submodule mismatch or uninitialized' >&2
            cat out/Gvault-Pages-public-SUBMODULES.txt >&2
            exit 53
          fi

          python3 - <<'PY'
          import hashlib, os, shutil, stat, zipfile
          from pathlib import Path
          root=Path('src')
          out=Path('out/Gvault-Pages-public-main-ad845a655371-WORKTREE.zip')
          def zi(name, mode, isdir=False):
              if isdir and not name.endswith('/'): name+='/'
              z=zipfile.ZipInfo(name,(1980,1,1,0,0,0)); z.create_system=3
              z.external_attr=(mode & 0xffff)<<16
              if isdir: z.external_attr|=0x10
              z.compress_type=zipfile.ZIP_DEFLATED
              return z
          with zipfile.ZipFile(out,'w',allowZip64=True) as z:
              def walk(base,arc=''):
                  for e in sorted(os.scandir(base),key=lambda x:x.name):
                      if e.name=='.git': continue
                      p=Path(e.path); rel=f'{arc}/{e.name}' if arc else e.name; st=os.lstat(p)
                      if stat.S_ISLNK(st.st_mode): z.writestr(zi(rel,st.st_mode),os.readlink(p).encode('utf-8','surrogateescape'))
                      elif stat.S_ISDIR(st.st_mode):
                          z.writestr(zi(rel,st.st_mode,True),b''); walk(p,rel)
                      elif stat.S_ISREG(st.st_mode):
                          with z.open(zi(rel,st.st_mode),'w') as dst, open(p,'rb') as src: shutil.copyfileobj(src,dst,1024*1024)
                      else: raise RuntimeError(f'Unsupported object {p}')
              walk(root)

          def scan_fs(base):
              d={}
              def walk(base,arc=''):
                  for e in sorted(os.scandir(base),key=lambda x:x.name):
                      if e.name=='.git': continue
                      p=Path(e.path); rel=f'{arc}/{e.name}' if arc else e.name; st=os.lstat(p); mode=stat.S_IMODE(st.st_mode)
                      if stat.S_ISLNK(st.st_mode): d[rel]=('L',mode,os.readlink(p))
                      elif stat.S_ISDIR(st.st_mode): d[rel+'/']=('D',mode,None); walk(p,rel)
                      elif stat.S_ISREG(st.st_mode):
                          h=hashlib.sha256()
                          with open(p,'rb') as f:
                              for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
                          d[rel]=('F',mode,h.hexdigest())
              walk(base); return d
          exp=scan_fs(root); got={}
          with zipfile.ZipFile(out) as z:
              bad=z.testzip(); assert bad is None, bad
              for x in z.infolist():
                  fm=(x.external_attr>>16)&0xffff; mode=stat.S_IMODE(fm)
                  if x.filename.endswith('/'): got[x.filename]=('D',mode,None)
                  elif stat.S_ISLNK(fm): got[x.filename]=('L',mode,z.read(x).decode('utf-8','surrogateescape'))
                  else:
                      h=hashlib.sha256()
                      with z.open(x) as f:
                          for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
                      got[x.filename]=('F',mode,h.hexdigest())
          assert exp==got, f'WORKTREE mismatch expected={len(exp)} got={len(got)}'
          print('WORKTREE VERIFIED entries=',len(exp))
          PY

          git clone --mirror "$PWD/src" stage/mirror/parent.git
          test "$(git --git-dir=stage/mirror/parent.git rev-parse refs/heads/main)" = "$PUBLIC_SHA" || git --git-dir=stage/mirror/parent.git update-ref refs/heads/main "$PUBLIC_SHA"
          test "$(git --git-dir=stage/mirror/parent.git rev-parse refs/heads/main)" = "$PUBLIC_SHA"
          git --git-dir=stage/mirror/parent.git fsck --full
          gd="$(git -C src rev-parse --absolute-git-dir)"
          if [ -d "$gd/lfs" ]; then cp -a "$gd/lfs" stage/mirror/parent.git/lfs; fi

          git -C src submodule foreach --recursive --quiet 'printf "%s\t%s\n" "$displaypath" "$(git rev-parse HEAD)"' > stage/submodules.tsv || true
          while IFS=$'\t' read -r p s; do
            [ -n "$p" ] || continue
            sub="src/$p"
            if command -v git-lfs >/dev/null 2>&1 && [ -n "$(git -C "$sub" lfs ls-files 2>/dev/null || true)" ]; then
              git -C "$sub" lfs pull; git -C "$sub" lfs fetch --all origin; git -C "$sub" lfs fsck
            fi
            dest="stage/mirror/submodules/$p.git"; mkdir -p "$(dirname "$dest")"
            git clone --mirror "$PWD/$sub" "$dest"
            git --git-dir="$dest" update-ref refs/backup/pinned "$s"
            test "$(git --git-dir="$dest" rev-parse refs/backup/pinned)" = "$s"
            git --git-dir="$dest" fsck --full
            sgd="$(git -C "$sub" rev-parse --absolute-git-dir)"; if [ -d "$sgd/lfs" ]; then cp -a "$sgd/lfs" "$dest/lfs"; fi
          done < stage/submodules.tsv
          cp stage/submodules.tsv out/Gvault-Pages-public-SUBMODULE-PINS.tsv

          (cd stage/mirror && zip -qry -y ../../out/Gvault-Pages-public-main-ad845a655371-GIT-MIRROR-WITH-LFS.zip .)
          unzip -t out/Gvault-Pages-public-main-ad845a655371-GIT-MIRROR-WITH-LFS.zip >/dev/null
          rm -rf stage/check && mkdir -p stage/check
          unzip -q out/Gvault-Pages-public-main-ad845a655371-GIT-MIRROR-WITH-LFS.zip -d stage/check
          test "$(git --git-dir=stage/check/parent.git rev-parse refs/heads/main)" = "$PUBLIC_SHA"
          git --git-dir=stage/check/parent.git fsck --full

          sha256sum out/*.zip > out/ALL_ARCHIVE_SHA256SUMS.txt
          stat -c '%s  %n' out/*.zip > out/ALL_ARCHIVE_SIZES.txt
          printf '%s\n' "$PUBLIC_SHA" > out/Gvault-Pages-public-SOURCE_SHA.txt
          cat > out/VERIFICATION.txt <<EOF
          Source: mourchoua-commits/Gvault-Pages main
          SHA: $PUBLIC_SHA
          WORKTREE ZIP: fully re-read with CRC; file SHA-256, Unix modes, directory entries and symlink targets matched checked-out source.
          GIT MIRROR ZIP: unpacked after creation; refs/heads/main rechecked at exact source SHA; git fsck --full passed. LFS object storage copied after fetch/fsck when LFS-tracked files existed. Recursive submodules are pinned bare mirrors when present.
          EOF
          cat out/ALL_ARCHIVE_SHA256SUMS.txt
          cat out/ALL_ARCHIVE_SIZES.txt

      - name: Upload verified backup set
        uses: actions/upload-artifact@v4
        with:
          name: GVAULT-PUBLIC-PHYSICAL-MAIN-20260911
          path: out/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
