name: GThink Public Sanitized Contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gthink-public-sanitized-contract.yml'
      - 'tests/gthink-public-sanitized-contract.mjs'
      - 'publications/gthink-peer/public-heartbeat.json'
      - 'publications/gthink-peer/private-sanitized-heartbeat.json'

permissions:
  contents: read

concurrency:
  group: gthink-public-sanitized-contract
  cancel-in-progress: true

jobs:
  verify-sanitized-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reciprocal sanitized contract
        run: node tests/gthink-public-sanitized-contract.mjs
