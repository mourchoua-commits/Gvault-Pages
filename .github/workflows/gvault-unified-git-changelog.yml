name: GVault Unified Git Changelog Public

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'publications/git-changelog/index.json'
  schedule:
    - cron: '29 */6 * * *'

permissions:
  contents: write

concurrency:
  group: gvault-unified-git-changelog-public
  cancel-in-progress: false

jobs:
  unify-and-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild sanitized public GThink/blob index
        run: node scripts/gvault-unify-git-changelog.mjs --visibility public --output publications/git-changelog/index.json

      - name: Verify sanitized schema and proof
        run: node scripts/gvault-unify-git-changelog.mjs --visibility public --output publications/git-changelog/index.json --verify-only

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Playwright public-feed guard
        run: npx playwright test tests/gvault-git-changelog-feed.spec.mjs --config=playwright.config.mjs

      - name: Commit refreshed public projection
        shell: bash
        run: |
          git config user.name 'gvault-unifier-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add publications/git-changelog/index.json
          if git diff --cached --quiet; then
            echo 'No unified index change.'
            exit 0
          fi
          git commit -m 'chore(gthink-blob): refresh public unified git changelog [skip ci]'
          git push
