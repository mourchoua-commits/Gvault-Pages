name: GThink provider loader bump

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gthink-provider-loader-bump.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gthink-provider-loader-bump
  cancel-in-progress: false

jobs:
  wire-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump responder loader and verify provider wiring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('gthink/index.html')
          s=p.read_text(encoding='utf-8')
          if 'gthink-public-responder.js?v=3' in s:
              s=s.replace('gthink-public-responder.js?v=3','gthink-public-responder.js?v=4',1)
          elif 'gthink-public-responder.js?v=4' not in s:
              raise SystemExit('GThink responder loader anchor not found')
          if 'data-gthink-public-responder="V3"' in s:
              s=s.replace('data-gthink-public-responder="V3"','data-gthink-public-responder="V4"',1)
          elif 'data-gthink-public-responder="V4"' not in s:
              raise SystemExit('GThink responder marker anchor not found')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'gthink-public-responder.js?v=4' gthink/index.html
          grep -q 'data-gthink-public-responder="V4"' gthink/index.html
          test -f scripts/gthink-provider-blob.js
          node --check scripts/gthink-provider-blob.js
          node --check scripts/gthink-public-responder.js
      - name: Commit loader bump
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- gthink/index.html; then
            echo 'Loader already at v4.'
            exit 0
          fi
          git config user.name 'GThink Blob Wiring'
          git config user.email 'actions@users.noreply.github.com'
          git add gthink/index.html
          git commit -m 'fix(gthink): load provider-aware responder v4'
          git push origin HEAD:main
