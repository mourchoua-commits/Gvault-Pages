name: Public Scout · Agent IA bridge

on:
  push:
    branches:
      - experiment/power-ranger-public-scout-20260830
    paths:
      - 'essai/control-tower/public-scout-agent-core-v1.mjs'
      - 'essai/control-tower/public-scout-agent-bridge-v1.mjs'
      - 'essai/control-tower/public-scout-agent-message-observer-v1.mjs'
      - 'essai/control-tower/public-scout-agent-private-writer-v1.mjs'
      - 'essai/control-tower/app-public-scout-v1.mjs'
      - 'scripts/public-scout-agent-bridge.test.mjs'
      - 'scripts/public-scout-agent-private-writer.test.mjs'
      - '.github/workflows/public-scout-agent-bridge.experimental.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Power Ranger Violet · Agent IA RX/TX
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/power-ranger-public-scout-20260830
          persist-credentials: false
          fetch-depth: 1
      - name: Static boundary checks
        shell: bash
        run: |
          set -euo pipefail
          node --check essai/control-tower/public-scout-agent-core-v1.mjs
          node --check essai/control-tower/public-scout-agent-bridge-v1.mjs
          node --check essai/control-tower/public-scout-agent-message-observer-v1.mjs
          node --check essai/control-tower/public-scout-agent-private-writer-v1.mjs
          node --check essai/control-tower/app-public-scout-v1.mjs
          if grep -Eiq 'GITHUB_TOKEN|secrets\.|node:https|node:http' essai/control-tower/public-scout-agent-core-v1.mjs essai/control-tower/public-scout-agent-bridge-v1.mjs; then
            echo 'AGENT_PUBLIC_BRIDGE_SECRET_OR_NODE_NETWORK_REFERENCE_FORBIDDEN' >&2
            exit 1
          fi
          if grep -Eiq 'repos/[^/]+/[^/]+/(issues|pulls|actions|branches)|/contents/(?!ops/public-scout/agent-outbox)' essai/control-tower/public-scout-agent-private-writer-v1.mjs 2>/dev/null; then
            echo 'AGENT_PRIVATE_WRITER_UNEXPECTED_API_SURFACE' >&2
            exit 1
          fi
      - name: RX/TX regression
        run: node scripts/public-scout-agent-bridge.test.mjs
      - name: Bounded private writer regression
        run: node scripts/public-scout-agent-private-writer.test.mjs
      - name: Summary
        if: always()
        run: |
          echo '## Power Ranger Violet · Agent IA RX/TX' >> "$GITHUB_STEP_SUMMARY"
          echo '- receive scout: verified public state only' >> "$GITHUB_STEP_SUMMARY"
          echo '- receive agent messages: exact message commit + ACK + hashes' >> "$GITHUB_STEP_SUMMARY"
          echo '- produce: PUBLIC_ONLY packet + SHA-256' >> "$GITHUB_STEP_SUMMARY"
          echo '- writer: private experimental outbox only' >> "$GITHUB_STEP_SUMMARY"
          echo '- writer durability: immutable pending packet before current pointer' >> "$GITHUB_STEP_SUMMARY"
          echo '- writer failure: sealed local outbox fallback' >> "$GITHUB_STEP_SUMMARY"
          echo '- secret patterns: rejected before writer' >> "$GITHUB_STEP_SUMMARY"
          echo '- private raw data allowed: false' >> "$GITHUB_STEP_SUMMARY"
          echo '- Megazord status: courrier scellé, casier privé, accusé de réception; personne ne court avec le token dans le couloir.' >> "$GITHUB_STEP_SUMMARY"
