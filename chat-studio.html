<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Orbitron:wght@600&family=Roboto+Mono&family=Dancing+Script:wght@600&family=Bungee&display=swap" rel="stylesheet" />
<title>Chat Studio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--app-font, 'Segoe UI', system-ui, -apple-system, sans-serif); -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: #050508; color: #dbdee1; height: 100dvh; display: flex; overflow: hidden; }
  #bg { position: fixed; inset: 0; z-index: 0; }
  #bg-veil { position: fixed; inset: 0; z-index: 1; background: radial-gradient(ellipse at center, rgba(5,5,10,.25) 0%, rgba(5,5,10,.82) 100%); pointer-events: none; }

  #sidebar { width: 240px; background: rgba(24,25,32,.82); backdrop-filter: blur(12px); display: flex; flex-direction: column; flex-shrink: 0; transition: transform .25s ease; z-index: 5; overflow-y: auto; border-right: 1px solid rgba(255,255,255,.06); }
  #sidebar h1 { font-size: 16px; padding: 16px; color: #fff; border-bottom: 1px solid rgba(255,255,255,.07); background: linear-gradient(90deg,#5865f2,#eb459e); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .side-section { padding: 10px 8px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #949ba4; font-weight: 700; }
  .channel { padding: 10px 12px; margin: 2px 8px; border-radius: 6px; cursor: pointer; color: #949ba4; font-size: 15px; user-select: none; }
  .channel:hover { background: rgba(255,255,255,.07); color: #fff; }
  .channel.active { background: rgba(88,101,242,.35); color: #fff; }
  .channel .hash { opacity: .6; margin-right: 4px; }
  .peer { display: flex; align-items: center; gap: 8px; padding: 6px 12px; margin: 2px 8px; border-radius: 6px; font-size: 14px; color: #b5bac1; }
  .peer .dot { width: 8px; height: 8px; border-radius: 50%; background: #57f287; flex-shrink: 0; box-shadow: 0 0 6px #57f287; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; z-index: 4; }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; z-index: 2; }
  #chat-header { position: relative; }
  #chat-header { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.07); font-weight: bold; color: #fff; display: flex; align-items: center; gap: 8px; row-gap: 6px; flex-wrap: wrap; background: rgba(24,25,32,.7); backdrop-filter: blur(12px); }
  #chat-header .hash { flex-shrink: 0; }
  #channel-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #room-tag { flex-shrink: 0; white-space: nowrap; }
  #chat-header button { flex-shrink: 0; }
  #chat-header .hash { color: #949ba4; }
  #room-tag { font-size: 11px; color: #b5bac1; font-weight: normal; background: rgba(255,255,255,.08); padding: 2px 8px; border-radius: 10px; }
  #burger { display: none; background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; padding: 4px 8px; min-width: 44px; min-height: 44px; }
  #call-btn { margin-left: auto; background: linear-gradient(90deg,#5865f2,#7b5cf0); border: none; color: #fff; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; min-height: 40px; white-space: nowrap; box-shadow: 0 0 12px rgba(88,101,242,.5); }
  #call-btn:hover { box-shadow: 0 0 18px rgba(88,101,242,.8); }

  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
  .msg { display: flex; gap: 12px; position: relative; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; font-size: 20px; overflow: hidden; background: #5865f2; box-shadow: 0 0 10px rgba(88,101,242,.5); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .msg-body { min-width: 0; flex: 1; }
  .msg-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .msg-author { font-weight: 600; font-size: 15px; }
  .msg-time { font-size: 11px; color: #949ba4; }
  .msg-text { font-size: 15px; word-wrap: break-word; overflow-wrap: anywhere; text-shadow: 0 1px 2px rgba(0,0,0,.8); }
  .msg-img { max-width: min(420px, 100%); max-height: 300px; border-radius: 8px; margin-top: 6px; cursor: pointer; display: block; border: 1px solid rgba(255,255,255,.1); }
  .reactions { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .react { background: rgba(24,25,32,.85); border: 1px solid transparent; border-radius: 10px; padding: 2px 8px; font-size: 13px; cursor: pointer; color: #dbdee1; }
  .react.mine { border-color: #5865f2; background: rgba(88,101,242,.3); }
  .react-picker { position: absolute; top: -34px; right: 0; background: #14151c; border-radius: 8px; padding: 4px; display: none; gap: 2px; box-shadow: 0 4px 12px rgba(0,0,0,.6); z-index: 3; border: 1px solid rgba(255,255,255,.08); }
  .react-picker.open { display: flex; }
  .react-picker button { background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px; border-radius: 6px; }
  .react-picker button:hover { background: rgba(255,255,255,.1); }
  #typing { padding: 4px 16px; font-size: 12px; color: #949ba4; height: 20px; font-style: italic; }

  #composer { padding: 0 16px calc(12px + env(safe-area-inset-bottom)); }
  #composer-inner { background: rgba(24,25,32,.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.08); border-radius: 8px; display: flex; align-items: center; padding: 4px 10px; gap: 4px; }
  #attach-btn, #send-btn { background: none; border: none; color: #b5bac1; font-size: 22px; cursor: pointer; min-width: 44px; min-height: 44px; }
  #attach-btn:hover, #send-btn:hover { color: #fff; }
  #msg-input { flex: 1; background: none; border: none; outline: none; color: #dbdee1; font-size: 16px; padding: 10px 4px; min-width: 0; }
  #msg-input::placeholder { color: #6d6f78; }

  #call-modal { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 10; padding: 20px; text-align: center; }
  #call-modal.open { display: flex; }
  #call-modal .big-avatar { width: 110px; height: 110px; border-radius: 50%; background: #5865f2; display: flex; align-items: center; justify-content: center; font-size: 44px; color: #fff; animation: pulse 1.6s infinite; overflow: hidden; }
  #call-modal .big-avatar img { width: 100%; height: 100%; object-fit: cover; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(88,101,242,.6);} 50% { box-shadow: 0 0 0 22px rgba(88,101,242,0);} }
  #call-modal h2 { margin-top: 18px; color: #fff; }
  #call-modal p { color: #949ba4; margin-top: 6px; }
  .call-actions { display: flex; gap: 14px; margin-top: 26px; }
  #hangup, .accept-btn { background: #da373c; border: none; color: #fff; font-size: 15px; padding: 12px 28px; border-radius: 24px; cursor: pointer; min-height: 44px; }
  .accept-btn { background: #57f287; color: #14151c; font-weight: 600; }
  #hangup:hover { background: #a12d31; }
  #videos { position: fixed; bottom: 90px; right: 16px; display: none; flex-direction: column; gap: 8px; z-index: 9; }
  #videos.open { display: flex; }
  #videos video { width: 180px; border-radius: 10px; background: #000; border: 2px solid #5865f2; }
  #videos video.local { border-color: #57f287; }

  #img-modal { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; z-index: 20; cursor: zoom-out; }
  #img-modal.open { display: flex; }
  #img-modal img { max-width: 94vw; max-height: 94vh; border-radius: 8px; }

  /* Login */
  #login { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; justify-content: safe center; flex-direction: column; gap: 12px; padding: 20px; overflow-y: auto; }
  #login h1 { color: #fff; margin-bottom: 4px; font-size: clamp(24px, 7vw, 34px); background: linear-gradient(90deg,#5865f2,#eb459e,#fee75c); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 14px rgba(88,101,242,.6)); }
  #login-box { background: rgba(24,25,32,.82); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.09); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 94vw; width: min(420px, 94vw); box-shadow: 0 8px 40px rgba(0,0,0,.6); }
  @media (max-height: 720px), (max-width: 480px) {
    #login { justify-content: flex-start; padding: 14px; gap: 8px; }
    #login h1 { margin: 4px auto 0; }
    #login-box { padding: 16px; gap: 8px; margin: 0 auto; }
    #avatar-grid { max-width: 220px; }
    #avatar-grid button { width: 38px; height: 38px; font-size: 19px; }
    #avatar-preview { width: 52px; height: 52px; font-size: 26px; }
  }
  #avatar-grid { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 260px; }
  #avatar-grid button { width: 44px; height: 44px; font-size: 22px; background: rgba(255,255,255,.06); border: 2px solid transparent; border-radius: 10px; cursor: pointer; }
  #avatar-grid button.sel { border-color: #5865f2; background: rgba(88,101,242,.3); }
  #avatar-preview { width: 64px; height: 64px; border-radius: 50%; background: #5865f2; display: flex; align-items: center; justify-content: center; font-size: 32px; overflow: hidden; box-shadow: 0 0 16px rgba(88,101,242,.6); }
  #avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
  #avatar-upload { color: #8b9bff; font-size: 13px; cursor: pointer; text-decoration: underline; }
  #pseudo-input, #room-input { background: rgba(0,0,0,.5); border: 1px solid rgba(88,101,242,.6); outline: none; color: #fff; padding: 12px 16px; border-radius: 8px; font-size: 16px; width: min(280px, 80vw); text-align: center; }
  #login-btn { background: linear-gradient(90deg,#5865f2,#7b5cf0); border: none; color: #fff; padding: 12px 32px; border-radius: 8px; font-size: 16px; cursor: pointer; min-height: 44px; width: min(280px, 80vw); box-shadow: 0 0 14px rgba(88,101,242,.5); }
  #login-btn:hover { box-shadow: 0 0 22px rgba(88,101,242,.8); }
  #net-status { font-size: 12px; color: #949ba4; }
  #net-status.online { color: #57f287; }
  #room-list-wrap { width: min(280px, 80vw); }
  #room-list-wrap h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #949ba4; margin-bottom: 6px; text-align: left; }
  .room-item { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; font-size: 14px; }
  .room-item .rname { flex: 1; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .room-item .rby { font-size: 11px; color: #949ba4; }
  .room-item button { background: #5865f2; border: none; color: #fff; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; min-height: 36px; }
  #create-row { display: flex; gap: 6px; width: min(280px, 80vw); }
  #create-room-input { flex: 1; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.15); outline: none; color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 15px; min-width: 0; }
  #create-room-btn { background: rgba(87,242,135,.15); border: 1px solid #57f287; color: #57f287; border-radius: 8px; padding: 10px 14px; cursor: pointer; font-size: 14px; white-space: nowrap; }

  /* Mode inversé : toutes les couleurs du site en négatif */
  body.invert { filter: invert(1) hue-rotate(180deg); }
  body.invert #bg, body.invert #videos video { filter: invert(1) hue-rotate(180deg); }
  body:not(.in) #main, body:not(.in) #sidebar, body:not(.in) #focus-btn { display: none; }
  /* Boutons du header (focus / logout) */
  #focus-btn, #logout-btn { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); color: #b5bac1; font-size: 16px; width: 40px; height: 40px; border-radius: 6px; cursor: pointer; padding: 0; }
  #focus-btn:hover, #logout-btn:hover { color: #fff; background: rgba(255,255,255,.15); }

  /* Wizz MSN */
  #wizz-btn { background: linear-gradient(90deg,#fee75c,#f47b20); border: none; color: #1e1f22; font-weight: 700; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; min-height: 40px; white-space: nowrap; }
  /* Mini-jeux */
  #games-btn { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); color: #b5bac1; font-size: 16px; width: 40px; height: 40px; border-radius: 6px; cursor: pointer; padding: 0; }
  #games-btn:hover { color: #fff; background: rgba(255,255,255,.15); }
  #games-menu { position: absolute; top: 52px; right: 12px; background: #14151c; border: 1px solid rgba(255,255,255,.1); border-radius: 10px; padding: 8px; display: none; flex-direction: column; gap: 4px; z-index: 15; min-width: 210px; box-shadow: 0 8px 30px rgba(0,0,0,.6); max-height: 60vh; overflow-y: auto; }
  #games-menu.open { display: flex; }
  #games-menu h4 { color: #949ba4; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; padding: 2px 6px 6px; }
  #games-menu a { color: #dbdee1; text-decoration: none; padding: 8px 10px; border-radius: 6px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
  #games-menu a:hover { background: rgba(88,101,242,.3); color: #fff; }

  /* Modale de jeu */
  #game-modal { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 25; gap: 10px; padding: 16px; }
  #game-modal.open { display: flex; }
  #game-modal h2 { color: #fff; font-size: 20px; }
  #game-area { background: #14151c; border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 12px; display: flex; align-items: center; justify-content: center; }
  #game-area canvas { max-width: 92vw; max-height: 62vh; border-radius: 8px; }
  #ttt-board { display: grid; grid-template-columns: repeat(3, 90px); grid-template-rows: repeat(3, 90px); gap: 6px; }
  #ttt-board button { font-size: 40px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; color: #fff; cursor: pointer; }
  #ttt-board button:hover { background: rgba(88,101,242,.3); }
  #game-status { color: #949ba4; font-size: 14px; min-height: 20px; }
  #game-close { background: #da373c; border: none; color: #fff; padding: 10px 24px; border-radius: 20px; cursor: pointer; font-size: 14px; min-height: 40px; }
  @keyframes wizz-shake { 0%,100%{transform:translate(0,0)} 20%{transform:translate(-8px,4px)} 40%{transform:translate(8px,-4px)} 60%{transform:translate(-6px,-3px)} 80%{transform:translate(6px,3px)} }
  body.wizz #main, body.wizz #sidebar { animation: wizz-shake .5s linear; }

  /* Polices */
  #font-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 280px; align-items: center; }
  #font-row button { background: rgba(255,255,255,.06); border: 2px solid transparent; color: #dbdee1; border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; min-height: 36px; }
  #font-row button.sel { border-color: #5865f2; background: rgba(88,101,242,.3); color: #fff; }
  #font-upload { color: #8b9bff; font-size: 12px; cursor: pointer; text-decoration: underline; width: 100%; text-align: center; }

  /* Couleurs d'écriture */
  #color-row { display: flex; gap: 6px; align-items: center; justify-content: center; }
  #color-row button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); cursor: pointer; padding: 0; }
  #color-row button.sel { border-color: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6); }
  #color-custom { width: 26px; height: 26px; border: none; background: none; cursor: pointer; padding: 0; }

  /* Paint Studio multi */
  #paint-wrap { display:flex; flex-direction:column; gap:8px; align-items:center; max-width:96vw; }
  #paint-bar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; justify-content:center; }
  #paint-bar .ptool { background: rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); color:#dbdee1; border-radius:8px; padding:6px 10px; cursor:pointer; font-size:14px; min-height:36px; }
  #paint-bar .ptool.active { border-color:#5865f2; background:rgba(88,101,242,.3); color:#fff; }
  #paint-bar .swatch { width:22px; height:22px; border-radius:50%; border:2px solid rgba(255,255,255,.25); cursor:pointer; padding:0; }
  #paint-bar .swatch.active { border-color:#fff; box-shadow:0 0 8px rgba(255,255,255,.7); }
  #paint-bar select, #paint-bar input[type=color] { background:#14151c; color:#dbdee1; border:1px solid rgba(255,255,255,.15); border-radius:8px; padding:5px 8px; font-size:13px; }
  #paint-canvas { background:#0a0a10; border:1px solid rgba(255,255,255,.15); border-radius:8px; touch-action:none; max-width:94vw; cursor:crosshair; }
  #paint-pads { display:none; grid-template-columns:repeat(6,1fr); gap:8px; width:min(420px,90vw); }
  #paint-pads.open { display:grid; }
  #paint-pads .pad { aspect-ratio:1; border-radius:50%; border:2px solid rgba(255,255,255,.25); cursor:pointer; }
  #paint-pads .pad.pressed { outline:3px solid #fff; box-shadow:0 0 12px #fff; }
  /* Monde vivant */
  #world-wrap { display:flex; flex-direction:column; gap:8px; align-items:center; max-width:96vw; }
  #world-bar { display:flex; gap:5px; flex-wrap:wrap; align-items:center; justify-content:center; max-width:94vw; }
  #world-bar .mat { padding:4px 8px; border:1px solid rgba(255,255,255,.15); border-radius:12px; background:rgba(255,255,255,.05); color:#dbdee1; cursor:pointer; font-size:12px; }
  #world-bar .mat.active { border-color:#5865f2; background:rgba(88,101,242,.35); color:#fff; }
  #world-bar .wbtn { background: rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); color:#dbdee1; border-radius:8px; padding:6px 10px; cursor:pointer; font-size:13px; min-height:34px; }
  #world-canvas { background:#0a0a14; border:1px solid rgba(255,255,255,.15); border-radius:8px; touch-action:none; max-width:94vw; cursor:crosshair; image-rendering:pixelated; }

  @media (max-width: 768px) {
    #burger { display: block; }
    #sidebar { position: fixed; top: 0; left: 0; bottom: 0; transform: translateX(-100%); box-shadow: 2px 0 12px rgba(0,0,0,.6); }
    #sidebar.open { transform: translateX(0); }
    #overlay.open { display: block; }
    #messages { padding: 12px; }
    #composer { padding: 0 10px calc(10px + env(safe-area-inset-bottom)); }
    #chat-header { flex-wrap: nowrap; gap: 5px; padding: 8px 10px; }
    #channel-name { flex: 1; }
    #room-tag { display: none; }
    #burger { min-width: 36px; min-height: 36px; font-size: 18px; padding: 4px 6px; }
    #chat-header button { padding: 6px 8px; font-size: 12px; }
    #focus-btn, #games-btn, #logout-btn { width: 34px; height: 34px; font-size: 14px; }
    #wizz-btn, #call-btn { min-height: 34px; padding: 6px 10px; font-size: 12px; }
    .msg-img { max-height: 220px; }
    #videos video { width: 120px; }
  }
  @media (max-width: 380px) {
    #call-btn { font-size: 0; }
    #call-btn::after { content: "📞"; font-size: 18px; }
    .avatar { width: 34px; height: 34px; font-size: 17px; }
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div id="bg-veil"></div>

<div id="login">
  <h1>Chat Studio</h1>
  <div id="login-box">
    <div id="avatar-preview">😀</div>
    <div id="avatar-grid"></div>
    <label id="avatar-upload">📷 ou upload une photo<input type="file" id="avatar-input" accept="image/*" hidden /></label>
    <input id="pseudo-input" placeholder="Ton pseudo..." maxlength="20" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" />
    <div id="font-row"></div>
    <label id="font-upload">📁 Importer une police (dafont .ttf/.otf/.woff)<input type="file" id="font-input" accept=".ttf,.otf,.woff,.woff2" hidden /></label>
    <div id="color-row"></div>
    <input type="color" id="color-custom" value="#dbdee1" title="Couleur perso" />
    <button id="login-btn">Rejoindre le salon</button>
    <div id="room-list-wrap">
      <h3>Salons ouverts</h3>
      <div id="room-list"></div>
    </div>
    <div id="create-row">
      <input id="create-room-input" placeholder="Nom du nouveau salon..." maxlength="30" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" />
      <button id="create-room-btn">Créer</button>
    </div>
    <div id="net-status">connexion au réseau...</div>
  </div>
</div>

<div id="overlay"></div>

<div id="sidebar">
  <h1>Chat Studio</h1>
  <div class="side-section">Salons</div>
  <div id="channels"></div>
  <div id="chan-create-row" style="display:flex;gap:4px;padding:4px 8px;">
    <input id="chan-create-input" placeholder="Nouveau salon..." maxlength="24" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" style="flex:1;min-width:0;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.12);border-radius:6px;color:#fff;padding:7px 9px;font-size:13px;" />
    <button id="chan-create-btn" style="background:#5865f2;border:none;color:#fff;border-radius:6px;padding:7px 10px;cursor:pointer;font-size:13px;">＋</button>
  </div>

<script type="module">
const DEFAULT_CHANNELS = ["général", "images", "blabla"];
let channels = []; // [{name, by}]
let myTag = "0000";

function tagFor(p) {
  const key = "chatstudio_tag_" + p;
  let t = localStorage.getItem(key);
  if (!t) { t = String(1000 + Math.floor(Math.random() * 9000)); localStorage.setItem(key, t); }
  return t;
}

function loadChannels() {
  try {
    const saved = JSON.parse(localStorage.getItem("chatstudio_channels_" + roomId));
    if (Array.isArray(saved) && saved.length) { channels = saved; return; }
  } catch(e) {}
  channels = DEFAULT_CHANNELS.map(n => ({ name: n, by: "système" }));
  saveChannels();
}
function saveChannels() {
  localStorage.setItem("chatstudio_channels_" + roomId, JSON.stringify(channels));
}
function addChannel(name, by, broadcastIt) {
  name = String(name || "").toLowerCase().replace(/[^a-z0-9-_]/g, "").slice(0, 24);
  if (!name || channels.find(c => c.name === name)) return;
  channels.push({ name, by: by || pseudo || "?" });
  saveChannels();
  if (broadcastIt !== false) broadcast({ type: "chan-add", name, by: pseudo });
  renderChannels();
}
function renameChannel(from, to, by, broadcastIt) {
  to = String(to || "").toLowerCase().replace(/[^a-z0-9-_]/g, "").slice(0, 24);
  const c = channels.find(c => c.name === from);
  if (!c || !to || channels.find(x => x.name === to)) return;
  if (by && c.by !== by) return; // seul le créateur peut renommer
  c.name = to;
  saveChannels();
  if (currentChannel === from) { currentChannel = to; localStorage.setItem("chatstudio_channel", to); $("channel-name").textContent = to; renderMessages(); }
  if (broadcastIt !== false) broadcast({ type: "chan-rename", from, to, by: pseudo });
  renderChannels();
}
const REACTIONS = ["👍", "❤️", "😂", "😮", "😢", "🔥"];
const EMOJI_AVATARS = ["😀","😎","🤖","👽","🐱","🦊","🐼","🦁","🐸","🐵"];
const COLORS = ["#5865f2","#57f287","#fee75c","#eb459e","#ed4245","#f47b20","#1abc9c"];
const APP_ID = "chat-studio-vibe-2026";
const LOBBY = "chat-studio-lobby";

let pseudo = null, avatar = "😀", roomId = "salon-principal", currentChannel = "général";
let room = null, sendChat = null, onChat = null, sendSignal = null, onSignal = null;
let lobby = null, sendLobby = null, onLobby = null;
let peers = {};
let localStream = null;
const peerConnections = {};

const $ = id => document.getElementById(id);
const messagesEl = $("messages"), input = $("msg-input"), sidebar = $("sidebar"), overlay = $("overlay");

/* ---------- Fond glitch animé (style de l'image) ---------- */
const bgCanvas = $("bg"), bgCtx = bgCanvas.getContext("2d");
const PALETTE = ["#5865f2","#57f287","#fee75c","#eb459e","#ed4245","#1abc9c","#f47b20","#8b9bff","#ffffff"];
function sizeBg() { bgCanvas.width = innerWidth; bgCanvas.height = innerHeight; bgCtx.fillStyle = "#050508"; bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height); }
sizeBg();
addEventListener("resize", sizeBg);
const streaks = [];
for (let i = 0; i < 120; i++) streaks.push(newStreak(true));
function newStreak(anyY) {
  return {
    x: Math.random() * innerWidth,
    y: anyY ? Math.random() * innerHeight : -Math.random() * 300,
    w: 1 + Math.random() * 3,
    h: 30 + Math.random() * innerHeight * 0.5,
    speed: 0.3 + Math.random() * 1.4,
    color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
    alpha: 0.06 + Math.random() * 0.4
  };
}
let bgFrame = 0;
function animateBg() {
  bgFrame++;
  bgCtx.fillStyle = "rgba(5,5,8,0.14)";
  bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
  for (const s of streaks) {
    s.y += s.speed;
    if (s.y - s.h > innerHeight) Object.assign(s, newStreak(false));
    bgCtx.globalAlpha = s.alpha;
    bgCtx.fillStyle = s.color;
    bgCtx.fillRect(s.x, s.y - s.h, s.w, s.h);
  }
  if (bgFrame % 40 === 0) { // flash glitch occasionnel
    for (let i = 0; i < 14; i++) {
      bgCtx.globalAlpha = 0.25 + Math.random() * 0.4;
      bgCtx.fillStyle = PALETTE[Math.floor(Math.random() * PALETTE.length)];
      const y = Math.random() * innerHeight;
      bgCtx.fillRect(0, y, innerWidth, 1 + Math.random() * 3);
    }
  }
  bgCtx.globalAlpha = 1;
  requestAnimationFrame(animateBg);
}
requestAnimationFrame(animateBg);

/* ---------- Navigation ---------- */
function leaveToLogin() {
  pseudo = null;
  document.body.classList.remove("in", "wizz", "invert");
  peers = {};
  Object.keys(typingUsers).forEach(k => delete typingUsers[k]);
  $("typing").textContent = "";
  if (room) { try { room.leave(); } catch(e) {} room = null; sendChat = null; onChat = null; sendSignal = null; onSignal = null; }
  Object.keys(peerConnections).forEach(closePeer);
  $("call-modal").classList.remove("open");
  $("login").style.display = "flex";
  connectLobby();
}

function closeSidebar() { sidebar.classList.remove("open"); overlay.classList.remove("open"); }
$("burger").onclick = () => { sidebar.classList.toggle("open"); overlay.classList.toggle("open"); };
overlay.onclick = closeSidebar;

function colorFor(name) { let h = 0; for (let i = 0; i < name.length; i++) h = (h*31 + name.charCodeAt(i)) % 997; return COLORS[h % COLORS.length]; }
function msgId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function loadMessages(ch) { try { return JSON.parse(localStorage.getItem("chatstudio_" + roomId + "_" + ch)) || []; } catch(e) { return []; } }
function saveMessages(ch, msgs) { localStorage.setItem("chatstudio_" + roomId + "_" + ch, JSON.stringify(msgs.slice(-200))); }

/* ---------- Portail images : IndexedDB (gros quota persistant, séparé du localStorage) ---------- */
const imgDB = new Promise((resolve, reject) => {
  const req = indexedDB.open("chatstudio-portail", 1);
  req.onupgradeneeded = () => req.result.createObjectStore("images", { keyPath: "id" });
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject(req.error);
});
function putImage(id, dataUrl) {
  return imgDB.then(db => new Promise((res, rej) => {
    const tx = db.transaction("images", "readwrite");
    tx.objectStore("images").put({ id, data: dataUrl });
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  })).catch(e => console.warn("portail image indisponible", e));
}
function getImage(id) {
  return imgDB.then(db => new Promise((res, rej) => {
    const tx = db.transaction("images", "readonly");
    const rq = tx.objectStore("images").get(id);
    rq.onsuccess = () => res(rq.result ? rq.result.data : null);
    rq.onerror = () => rej(rq.error);
  })).catch(() => null);
}

$("chan-create-btn").onclick = () => { addChannel($("chan-create-input").value, pseudo); $("chan-create-input").value = ""; };
$("chan-create-input").addEventListener("keydown", e => { if (e.key === "Enter") $("chan-create-btn").click(); });

/* ---------- Rendu ---------- */
function renderChannels() {
  const el = $("channels"); el.innerHTML = "";
  channels.forEach(c => {
    const d = document.createElement("div");
    d.className = "channel" + (c.name === currentChannel ? " active" : "");
    d.innerHTML = '<span class="hash">#</span><span class="cname"></span>';
    d.querySelector(".cname").textContent = c.name;
    d.onclick = () => { currentChannel = c.name; localStorage.setItem("chatstudio_channel", c.name); $("channel-name").textContent = c.name; renderChannels(); renderMessages(); closeSidebar(); };
    if (c.by === pseudo) { // seul le créateur peut renommer
      const edit = document.createElement("span");
      edit.textContent = " ✏️"; edit.title = "Renommer (créateur uniquement)";
      edit.style.cursor = "pointer"; edit.style.fontSize = "12px";
      edit.onclick = e => {
        e.stopPropagation();
        const to = prompt("Nouveau nom du salon #" + c.name + " :", c.name);
        if (to) renameChannel(c.name, to, pseudo);
      };
      d.appendChild(edit);
    }
    el.appendChild(d);
  });
}

function avatarHtml(a, cls) {
  if (a && a.startsWith("data:")) return `<div class="${cls}"><img src="${a}" alt=""/></div>`;
  return `<div class="${cls}" style="background:${colorFor(a || "?")}">${a || "?"}</div>`;
}

function renderMessages() {
  const msgs = loadMessages(currentChannel);
  messagesEl.innerHTML = "";
  msgs.forEach(m => messagesEl.appendChild(msgNode(m)));
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function msgNode(m) {
  const div = document.createElement("div");
  div.className = "msg"; div.dataset.id = m.id;
  const ac = colorFor(m.author);
  div.style.borderLeft = "3px solid " + ac;
  div.style.paddingLeft = "10px";
  div.style.borderRadius = "4px";
  div.insertAdjacentHTML("beforeend", avatarHtml(m.avatar, "avatar"));
  const body = document.createElement("div");
  body.className = "msg-body";
  if (m.font) body.style.fontFamily = m.font; // chaque message garde la police de son auteur
  if (m.color) body.style.color = m.color; // et la couleur d'écriture de son auteur
  const head = document.createElement("div"); head.className = "msg-head";
  const a = document.createElement("span"); a.className = "msg-author"; a.style.color = ac; a.textContent = m.author + "#" + (m.tag || "0000");
  if (m.font) a.style.fontFamily = m.font;
  const t = document.createElement("span"); t.className = "msg-time"; t.textContent = m.time;
  head.appendChild(a); head.appendChild(t); body.appendChild(head);
  if (m.text) { const tx = document.createElement("div"); tx.className = "msg-text"; tx.textContent = m.text; body.appendChild(tx); }
  if (m.image || m.imgId) {
    const img = document.createElement("img"); img.className = "msg-img"; img.loading = "lazy";
    img.onclick = () => { if (img.src) { $("img-modal-src").src = img.src; $("img-modal").classList.add("open"); } };
    body.appendChild(img);
    if (m.image) img.src = m.image;
    else getImage(m.imgId).then(d => { if (d) img.src = d; });
  }
  const reacts = document.createElement("div"); reacts.className = "reactions";
  const counts = {};
  (m.reactions || []).forEach(r => { counts[r.emoji] = counts[r.emoji] || new Set(); counts[r.emoji].add(r.from); });
  Object.entries(counts).forEach(([emoji, set]) => {
    const b = document.createElement("button");
    b.className = "react" + (set.has(pseudo) ? " mine" : "");
    b.textContent = emoji + " " + set.size;
    b.onclick = () => toggleReaction(m.id, emoji);
    reacts.appendChild(b);
  });
  body.appendChild(reacts);
  const picker = document.createElement("div"); picker.className = "react-picker";
  REACTIONS.forEach(e => {
    const b = document.createElement("button"); b.textContent = e;
    b.onclick = ev => { ev.stopPropagation(); toggleReaction(m.id, e); picker.classList.remove("open"); };
    picker.appendChild(b);
  });
  div.appendChild(body); div.appendChild(picker);
  div.addEventListener("contextmenu", e => { e.preventDefault(); picker.classList.toggle("open"); });
  div.addEventListener("click", e => { if (!e.target.closest(".react-picker") && !e.target.closest(".react")) picker.classList.remove("open"); });
  return div;
}

function toggleReaction(id, emoji) {
  const msgs = loadMessages(currentChannel);
  const m = msgs.find(x => x.id === id); if (!m) return;
  m.reactions = m.reactions || [];
  const i = m.reactions.findIndex(r => r.from === pseudo && r.emoji === emoji);
  if (i >= 0) m.reactions.splice(i, 1); else m.reactions.push({ from: pseudo, emoji });
  saveMessages(currentChannel, msgs);
  broadcast({ type: "react", channel: currentChannel, id, from: pseudo, emoji, delta: i >= 0 ? -1 : 1 });
  renderMessages();
}

/* ---------- Lobby : découverte des salons ---------- */
const knownRooms = {};
function addRoom(name, by) {
  if (!name) return;
  knownRooms[name] = { name, by: by || "quelqu'un", ts: Date.now() };
  try {
    const saved = JSON.parse(localStorage.getItem("chatstudio_rooms") || "{}");
    saved[name] = knownRooms[name];
    localStorage.setItem("chatstudio_rooms", JSON.stringify(saved));
  } catch(e) {}
  renderRoomList();
}
function renderRoomList() {
  const el = $("room-list"); el.innerHTML = "";
  const entries = Object.values(knownRooms).sort((a, b) => b.ts - a.ts).slice(0, 12);
  if (!entries.length) { el.innerHTML = '<div style="font-size:12px;color:#6d6f78;padding:4px 0">Aucun salon pour l\'instant, crée le tien !</div>'; return; }
  entries.forEach(r => {
    const d = document.createElement("div"); d.className = "room-item";
    d.innerHTML = `<span style="color:#8b9bff">#</span><span class="rname"></span><span class="rby"></span>`;
    d.querySelector(".rname").textContent = r.name;
    d.querySelector(".rby").textContent = "par " + (r.by || "?");
    const b = document.createElement("button"); b.textContent = "Rejoindre";
    b.onclick = () => { roomId = r.name; joinRoom(); };
    d.appendChild(b);
    el.appendChild(d);
  });
}
try { Object.values(JSON.parse(localStorage.getItem("chatstudio_rooms") || "{}")).forEach(r => addRoom(r.name, r.by)); } catch(e) {}

async function connectLobby() {
  const status = $("net-status");
  try {
    const trystero = await import("https://esm.sh/trystero@0.21.8/nostr");
    if (lobby) return;
    lobby = trystero.joinRoom({ appId: APP_ID }, LOBBY);
    [sendLobby, onLobby] = lobby.makeAction("rooms");
    onLobby(data => { if (data && data.name) addRoom(data.name, data.by); });
    sendLobby({ name: roomId, by: pseudo || "quelqu'un" });
    status.textContent = "● en ligne (découverte des salons active)";
    status.classList.add("online");
  } catch (e) {
    status.textContent = "○ mode local";
  }
}
function leaveLobby() { if (lobby) { try { lobby.leave(); } catch(e) {} lobby = null; sendLobby = null; } }

$("create-room-btn").onclick = () => {
  const name = $("create-room-input").value.trim().toLowerCase().replace(/[^a-z0-9-_]/g, "");
  if (!name) { $("create-room-input").focus(); return; }
  roomId = name;
  addRoom(name, pseudo || "toi");
  if (sendLobby) sendLobby({ name, by: pseudo || "toi" });
  joinRoom();
};
$("create-room-input").addEventListener("keydown", e => { if (e.key === "Enter") $("create-room-btn").click(); });

/* ---------- Salon (Trystero WebRTC serverless) ---------- */
async function connectNet() {
  try {
    const trystero = await import("https://esm.sh/trystero@0.21.8/nostr");
    leaveLobby();
    room = trystero.joinRoom({ appId: APP_ID }, roomId);
    [sendChat, onChat] = room.makeAction("chat");
    [sendSignal, onSignal] = room.makeAction("signal");
    room.onPeerJoin(id => {
      peers[id] = peers[id] || {};
      sendChat({ type: "hello", pseudo, tag: myTag, avatar, font: currentFontCss, color: currentColorCss }, id);
      renderPeers();
    });
    room.onPeerLeave(id => { delete peers[id]; closePeer(id); renderPeers(); });
    onChat((data, id) => handleNet(data, id));
    onSignal((data, id) => handleSignal(data, id));
    sendChat({ type: "hello", pseudo, tag: myTag, avatar, font: currentFontCss, color: currentColorCss });
  } catch (e) {}
}

function handleNet(data, id) {
  if (!data) return;
  if (data.type === "hello") { peers[id] = { pseudo: data.pseudo, tag: data.tag, avatar: data.avatar, font: data.font, color: data.color }; renderPeers(); }
  else if (data.type === "wizz") doWizz(data.pseudo);
  else if (data.type === "msg") addRemoteMessage(data);
  else if (data.type === "chan-add") addChannel(data.name, data.by, false);
  else if (data.type === "chan-rename") renameChannel(data.from, data.to, data.by, false);
  else if (data.type === "react") {
    const msgs = loadMessages(data.channel);
    const m = msgs.find(x => x.id === data.id); if (!m) return;
    m.reactions = m.reactions || [];
    const i = m.reactions.findIndex(r => r.from === data.from && r.emoji === data.emoji);
    if (data.delta > 0 && i < 0) m.reactions.push({ from: data.from, emoji: data.emoji });
    if (data.delta < 0 && i >= 0) m.reactions.splice(i, 1);
    saveMessages(data.channel, msgs);
    if (data.channel === currentChannel) renderMessages();
  }
  else if (data.type === "typing") showTyping(data.pseudo);
  else if (data.type === "game") handleGame(data);
}

function addRemoteMessage(d) {
  const msgs = loadMessages(d.channel);
  if (msgs.find(x => x.id === d.id)) return;
  const m = { id: d.id, author: d.author, tag: d.tag, avatar: d.avatar, font: d.font, color: d.color, text: d.text, image: null, imgId: d.image ? d.id : null, time: d.time, reactions: [] };
  msgs.push(m);
  saveMessages(d.channel, msgs);
  if (d.image) putImage(d.id, d.image);
  if (d.channel === currentChannel) renderMessages();
  notify(d.author + " : " + (d.text || "📷 image"));
}

/* ---------- Notifications ---------- */
let notifCount = 0;
function notify(text) {
  if (document.hasFocus()) return;
  notifCount++;
  document.title = "(" + notifCount + ") Chat Studio";
  beep();
  if (Notification.permission === "granted") new Notification("Chat Studio", { body: text });
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { notifCount = 0; document.title = "Chat Studio"; } });
window.addEventListener("focus", () => { notifCount = 0; document.title = "Chat Studio"; });
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.08;
    o.start(); o.stop(ctx.currentTime + 0.15);
  } catch (e) {}
}

/* ---------- Typing ---------- */
const typingUsers = {};
let lastTypingSent = 0;
input.addEventListener("input", () => {
  const now = Date.now();
  if (now - lastTypingSent > 2000) { lastTypingSent = now; broadcast({ type: "typing", pseudo }); }
});
function showTyping(name) {
  typingUsers[name] = Date.now();
  $("typing").textContent = name + " est en train d'écrire...";
  clearTimeout(showTyping._t);
  showTyping._t = setTimeout(() => {
    Object.keys(typingUsers).forEach(k => { if (Date.now() - typingUsers[k] > 3500) delete typingUsers[k]; });
    $("typing").textContent = Object.keys(typingUsers).length ? Object.keys(typingUsers)[0] + " est en train d'écrire..." : "";
  }, 3500);
}

function broadcast(d) { if (sendChat) { try { sendChat(d); } catch(e) { console.warn("broadcast échoué", e); } } }

/* ---------- Envoi ---------- */
function send(text, image) {
  if (!text && !image || !pseudo) return;
  const now = new Date();
  const id = msgId();
  const m = {
    id, author: pseudo, tag: myTag, avatar, font: currentFontCss, color: currentColorCss,
    text: text || "", image: null, imgId: image ? id : null,
    time: now.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }),
    reactions: []
  };
  const msgs = loadMessages(currentChannel);
  msgs.push(m);
  try { saveMessages(currentChannel, msgs); } catch(e) { console.warn("localStorage plein", e); msgsKeepAlive.push(m); }
  if (image) putImage(id, image); // l'image part dans le portail, pas dans localStorage
  renderMessages();
  broadcast({ type: "msg", channel: currentChannel, ...m, image });
}
const msgsKeepAlive = [];
$("send-btn").onclick = () => { send(input.value.trim(), null); input.value = ""; input.focus(); };
input.addEventListener("keydown", e => { if (e.key === "Enter") { send(input.value.trim(), null); input.value = ""; } });
$("attach-btn").onclick = () => $("file-input").click();
$("file-input").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  $("file-input").value = "";
  const r = new FileReader();
  r.onload = () => { send("", r.result); };
  r.readAsDataURL(f);
});

/* ---------- Appel WebRTC ---------- */
$("call-btn").onclick = async () => {
  const targets = Object.keys(peers);
  if (!targets.length) { openCallModal("📞", "Appel", "Personne n'est en ligne dans ce salon..."); return; }
  try { localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true }); }
  catch (e) { localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false }); }
  showLocalVideo();
  targets.forEach(id => { sendSignal({ to: id, data: { incoming: true } }, id); startCall(id, true); });
  openCallModal(avatar, "Appel en cours...", "Connexion avec " + targets.map(id => peers[id].pseudo || "?").join(", ") + "...");
};

async function startCall(peerId, isCaller) {
  if (peerConnections[peerId]) return;
  if (!localStream) return; // pas de micro/cam dispo -> pas d'appel
  const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
  peerConnections[peerId] = pc;
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.onicecandidate = ev => { if (ev.candidate) sendSignal({ to: peerId, data: { candidate: ev.candidate } }, peerId); };
  pc.ontrack = ev => showRemoteVideo(peerId, ev.streams[0]);
  pc.onconnectionstatechange = () => { if (pc.connectionState === "failed" || pc.connectionState === "closed") closePeer(peerId); };
  if (isCaller) {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    sendSignal({ to: peerId, data: { sdp: pc.localDescription } }, peerId);
  }
}

async function handleSignal(msg, from) {
  if (!msg) return;
  const data = msg.data;
  if (data.incoming) {
    if (!localStream) {
      try { localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true }); showLocalVideo(); } catch(e) {}
    }
    openCallModal(peers[from] ? peers[from].avatar : "📞", "📲 Appel entrant", (peers[from] ? peers[from].pseudo : "Quelqu'un") + " t'appelle !");
    $("accept-call").style.display = "inline-block";
    $("accept-call").onclick = () => {
      $("accept-call").style.display = "none";
      $("call-status").textContent = "En ligne !";
    };
    return;
  }
  let pc = peerConnections[from];
  if (data.sdp) {
    if (!pc) { await startCall(from, false); pc = peerConnections[from]; }
    await pc.setRemoteDescription(data.sdp);
    if (data.sdp.type === "offer") {
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      sendSignal({ to: from, data: { sdp: pc.localDescription } }, from);
    }
  } else if (data.candidate && pc) {
    try { await pc.addIceCandidate(data.candidate); } catch(e) {}
  }
}

function closePeer(id) {
  if (peerConnections[id]) { try { peerConnections[id].close(); } catch(e) {} delete peerConnections[id]; }
  const v = document.getElementById("vid-" + id); if (v) v.remove();
  if (!Object.keys(peerConnections).length) {
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    const lv = $("vid-local"); if (lv) lv.remove();
    $("videos").classList.remove("open");
  }
}
function showLocalVideo() {
  $("videos").classList.add("open");
  if (!document.getElementById("vid-local")) {
    const v = document.createElement("video");
    v.id = "vid-local"; v.className = "local"; v.autoplay = true; v.muted = true; v.playsInline = true;
    v.srcObject = localStream;
    $("videos").appendChild(v);
  }
}
function showRemoteVideo(id, stream) {
  $("videos").classList.add("open");
  let v = document.getElementById("vid-" + id);
  if (!v) { v = document.createElement("video"); v.id = "vid-" + id; v.autoplay = true; v.playsInline = true; $("videos").appendChild(v); }
  v.srcObject = stream;
}

function handleGame(d) {
  if (!d || !d.action) return;
  if (d.action === "start") {
    if (!game) { game = { id: d.id, owner: d.owner, state: null }; openGame(d.id, d.id === "pong" ? "🏓 Pong 1v1" : "⭕ Morpion"); }
    else if (game.id === d.id && game.owner !== d.owner) { game.owner = d.owner; $("game-status").textContent = "Partie lancée !"; }
    return;
  }
  if (d.action === "quit") { if (game) { stopPong(); stopWorld(); game = null; $("game-modal").classList.remove("open"); } return; }
  if (!game || game.id !== d.id) return;
  if (game.id === "morpion") gameMorpion(d);
  if (game.id === "pong") gamePong(d);
  if (game.id === "paint") gamePaint(d);
  if (game.id === "world") gameWorld(d);
}

let ttt = null;
function initMorpion() {
  ttt = { board: Array(9).fill(""), turn: "X" };
  const board = document.createElement("div"); board.id = "ttt-board";
  ttt.board.forEach((v, i) => {
    const b = document.createElement("button");
    b.textContent = v;
    b.onclick = () => {
      if (!ttt || ttt.board[i] || ttt.turn !== mySymbol()) return;
      broadcast({ type: "game", action: "move", id: "morpion", cell: i, sym: ttt.turn });
      applyTttMove(i, ttt.turn);
    };
    board.appendChild(b);
  });
  $("game-area").appendChild(board);
  updateTttStatus();
}
function mySymbol() { return game && game.owner === pseudo ? "X" : "O"; }
function applyTttMove(i, sym) {
  ttt.board[i] = sym;
  const btns = $("ttt-board").children;
  btns[i].textContent = sym;
  const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  if (wins.some(w => w.every(x => ttt.board[x] === sym))) { $("game-status").textContent = "🎉 " + sym + " gagne !"; broadcast({type:"game",action:"move",id:"morpion",cell:-1,sym}); ttt = null; setTimeout(()=>{ if(game) initMorpion(); }, 2500); return; }
  if (ttt.board.every(v => v)) { $("game-status").textContent = "Match nul !"; ttt = null; setTimeout(()=>{ if(game) initMorpion(); }, 2500); return; }
  ttt.turn = sym === "X" ? "O" : "X";
  updateTttStatus();
}
function updateTttStatus() {
  if (!ttt) return;
  $("game-status").textContent = ttt.turn === mySymbol() ? "À toi de jouer (" + mySymbol() + ")" : "Tour de l'adversaire (" + ttt.turn + ")";
}
function gameMorpion(d) {
  if (d.action === "move") { if (d.cell >= 0 && ttt) applyTttMove(d.cell, d.sym); }
}

/* ----- Pong 1v1 ----- */
let pong = null, pongRAF = null;
function initPong() {
  const c = document.createElement("canvas");
  c.width = 640; c.height = 400; c.style.background = "#050508"; c.style.maxWidth = "92vw";
  $("game-area").appendChild(c);
  pong = { c, ctx: c.getContext("2d"), ball: { x: 320, y: 200, vx: 4, vy: 3 }, p1: 160, p2: 160, s1: 0, s2: 0, host: game.owner === pseudo };
  if (pong.host) $("game-status").textContent = "Tu es le serveur : à toi de lancer ! (souris/haut-bas)";
  else $("game-status").textContent = "Adversaire : déplace ta raquette (souris/haut-bas)";
  c.addEventListener("mousemove", e => {
    const r = c.getBoundingClientRect();
    const y = (e.clientY - r.top) * (400 / r.height);
    if (pong.host) pong.p1 = y; else pong.p2 = y;
    broadcast({ type: "game", action: "paddle", id: "pong", y });
  });
  c.addEventListener("touchmove", e => {
    e.preventDefault();
    const r = c.getBoundingClientRect();
    const y = (e.touches[0].clientY - r.top) * (400 / r.height);
    if (pong.host) pong.p1 = y; else pong.p2 = y;
    broadcast({ type: "game", action: "paddle", id: "pong", y });
  }, { passive: false });
  if (pong.host) pongLoop();
  drawPong();
}
function pongLoop() {
  if (!pong || !game || game.id !== "pong") return;
  const b = pong.ball;
  b.x += b.vx; b.y += b.vy;
  if (b.y < 8 || b.y > 392) b.vy *= -1;
  if (b.x < 24 && Math.abs(b.y - pong.p1) < 50) { b.vx = Math.abs(b.vx) + 0.3; b.vy += (b.y - pong.p1) * 0.08; }
  if (b.x > 616 && Math.abs(b.y - pong.p2) < 50) { b.vx = -Math.abs(b.vx) - 0.3; b.vy += (b.y - pong.p2) * 0.08; }
  if (b.x < 0) { pong.s2++; b.x = 320; b.y = 200; b.vx = 4; b.vy = 3; }
  if (b.x > 640) { pong.s1++; b.x = 320; b.y = 200; b.vx = -4; b.vy = 3; }
  broadcast({ type: "game", action: "state", id: "pong", ball: b, p1: pong.p1, p2: pong.p2, s1: pong.s1, s2: pong.s2 });
  drawPong();
  pongRAF = setTimeout(pongLoop, 33);
}
function stopPong() { if (pongRAF) clearTimeout(pongRAF); pongRAF = null; pong = null; }
function drawPong() {
  if (!pong) return;
  const x = pong.ctx;
  x.fillStyle = "#050508"; x.fillRect(0, 0, 640, 400);
  x.strokeStyle = "rgba(255,255,255,.25)"; x.setLineDash([6, 8]); x.beginPath(); x.moveTo(320, 0); x.lineTo(320, 400); x.stroke(); x.setLineDash([]);
  x.fillStyle = "#57f287"; x.fillRect(8, pong.p1 - 40, 12, 80);
  x.fillStyle = "#eb459e"; x.fillRect(620, pong.p2 - 40, 12, 80);
  x.fillStyle = "#fff"; x.beginPath(); x.arc(pong.ball.x, pong.ball.y, 7, 0, 7); x.fill();
  x.font = "28px sans-serif"; x.fillText(pong.s1, 280, 36); x.fillText(pong.s2, 340, 36);
}
function gamePong(d) {
  if (!pong) return;
  if (d.action === "paddle") { if (pong.host) pong.p2 = d.y; else pong.p1 = d.y; drawPong(); }
  if (d.action === "state" && !pong.host) {
    pong.ball = d.ball; pong.p1 = d.p1; pong.p2 = d.p2; pong.s1 = d.s1; pong.s2 = d.s2;
    drawPong();
  }
}

function audioCtx(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx && actx.state==="suspended") actx.resume(); return actx; }
function midiOf(y){ const penta=[0,2,4,7,9,12,14,16,19,21,24]; const i=Math.min(penta.length-1, Math.floor((P.rows-1-y)/P.rows*penta.length)); return 72+penta[penta.length-1-i]; }

function playInst(inst, midi, dur){

  if(SFX_IDS.has(inst)){
    const len=Math.floor(ctx.sampleRate*0.4), buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);

  const paintAt=e=>{ const c=cellAt(e); const cells=[];
    for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){ if(dx*dx+dy*dy>5) continue; const x=c[0]+dx, y=c[1]+dy;
      if(W.brush===0) wPut(x,y,0);
      else if(!wGet(x,y)||W.brush===1||W.brush===8) wPut(x,y,W.brush);
      if(x>=0&&x<WW&&y>=0&&y<WH) cells.push({x:x,y:y,m:W.grid[wIdx(x,y)]}); }
    if(W.brush>0){ W.resonant=W.brush; W.resonantUntil=performance.now()+1400; const mt=WMAT_BY_ID[W.brush]; if(mt.inst) playInst(mt.inst, 60+W.brush*3, 0.4); }
    wRender();
    return cells; };
  cv.addEventListener("pointerdown",e=>{ e.preventDefault(); audioCtx(); W.painting=true; W.stroke=paintAt(e); try{cv.setPointerCapture(e.pointerId);}catch(err){} });
  cv.addEventListener("pointermove",e=>{ if(!W.painting) return; W.stroke=W.stroke.concat(paintAt(e)); });
  window.addEventListener("pointerup",()=>{ if(!W.painting) return; W.painting=false; if(W.stroke.length) broadcast({type:"game",action:"wpaint",id:"world",cells:W.stroke}); W.stroke=[]; });
  $("world-clear").onclick=()=>{ W.grid.fill(0); W.life.fill(0); wRender(); broadcast({type:"game",action:"wclear",id:"world"}); };
  $("world-seed").onclick=()=>{ const s=wSeed(); broadcast({type:"game",action:"wseed",id:"world"}); $("game-status").textContent="🌰 "+s+" graines semées — ajoute de l'eau !"; };
  $("world-play").onclick=()=>{ broadcast({type:"game",action:"wplay",id:"world"}); wPlay(); };
  if(!W.timer) W.timer=setInterval(wTick,50);
  wRender();
  $("game-status").textContent="🪐 Peins ton écosystème (matières du tableau périodique) : eau fait pousser les graines, lave + eau = pierre, feu brûle le bois… ▶️ le monde se joue en musique !";
}
function stopWorld(){ if(W.timer){ clearInterval(W.timer); W.timer=null; } }
function gameWorld(d){
  if(!W.cv) return;
  if(d.action==="wpaint"){ d.cells.forEach(c=>{ if(c.x>=0&&c.y>=0&&c.x<WW&&c.y<WH){ W.grid[wIdx(c.x,c.y)]=c.m; } }); wRender(); }
  else if(d.action==="wclear"){ W.grid.fill(0); W.life.fill(0); wRender(); }
  else if(d.action==="wseed"){ wSeed(); }
  else if(d.action==="wplay"){ wPlay(); }
}

renderRoomList();
connectLobby();
$("img-modal").onclick = function () { this.classList.remove("open"); };
</script>
